name: Integrate precompiled feature branch
on:
  push:
    branches: [feature/precompiled-v8-cache-sdk]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'SceneTech/WebScene' && github.ref == 'refs/heads/feature/precompiled-v8-cache-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed integration points
        run: python .automation/apply-precompiled.py
      - name: Compile and run real V8 smoke contracts
        working-directory: experiments/WebScene.NativeEngine.Probe
        run: |
          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          c++ -std=c++20 -shared -fPIC -I"$NODE_ROOT/include/node" -Inative tests/precompiled/node_adapter.cpp -lcrypto -o tests/precompiled/adapter.node
          node tests/precompiled/test_v8.cjs
          c++ -std=c++20 -fsyntax-only -Inative tests/precompiled/native_engine_tests.cpp
          c++ -std=c++20 -fsyntax-only -Inative native/webscene_precompiled_javascript_stub.cpp
      - name: Run build pipeline fixtures
        run: python -m unittest discover -s experiments/WebScene.NativeEngine.Probe/tests/precompiled -p 'test_*.py' -v
      - name: Commit integrated sources to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Integrate packaged V8 caches into runtime loading and SDK installation'
          git push origin HEAD:refs/heads/feature/precompiled-v8-cache-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: precompiled-source-checkout
          path: |
            experiments/WebScene.NativeEngine.Probe/native/webscene_precompiled*
            experiments/WebScene.NativeEngine.Probe/native/webscene_v8_runtime_cache_and_frames.inc
            experiments/WebScene.NativeEngine.Probe/native/webscene_v8_runtime_modules.inc
            experiments/WebScene.NativeEngine.Probe/native/webscene_native_engine.h
            experiments/WebScene.NativeEngine.Probe/tests/precompiled/*.cpp
            src/WebScene.Sdk/cmake/WebScene*JavaScript.cmake
          retention-days: 3
