name: NuGet packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified repository version to NuGet.org
        required: true
        default: false
        type: boolean
      consumer_recheck_run_id:
        description: Existing run whose verified release artifact should be rechecked
        required: false
        default: ''
        type: string
      consumer_recheck_version:
        description: Package version in the existing release artifact
        required: false
        default: 1.0.35
        type: string
  push:
    branches:
    - main
    tags:
    - 'v*'
  pull_request:
    branches:
    - main
    - release/*
    paths:
    - '.github/workflows/native-runtime-packages.yml'
    - 'experiments/WebScene.NativeEngine.Probe/**'
    - 'packaging/WebScene.NativeEngine.Runtime/**'
    - 'scripts/build-native-engine-runtime.sh'
    - 'scripts/build-linux-native-runtime.sh'
    - 'scripts/linux-glibc-toolchain.cmake'
    - 'scripts/verify-linux-native-abi.py'
    - 'scripts/build-native-engine-runtime.ps1'
    - 'scripts/pack-packages.sh'
    - 'scripts/verify-cross-rid-compatibility.py'
    - 'scripts/tests/test_verify_cross_rid_compatibility.py'
    - 'scripts/verify-release-packages.py'
    - 'src/WebScene.Backend.Abstractions/**'
    - 'src/WebScene.Backend.Avalonia/**'
    - 'src/WebScene.Backend.Uno/**'
    - 'src/WebScene.Sdk.Avalonia/**'
    - 'src/WebScene.Sdk.NativeHost.Shared/**'
    - 'src/WebScene.Sdk.Uno/**'
    - 'src/WebScene.Diagnostics.Cdp/**'
    - 'tests/WebPlatformSubset/**'
    - 'tests/WebScene.Runtime.PackageSmoke/**'
    - 'tests/Shared/**'
    - 'tests/WebScene.Uno.PackageSmoke/**'
    - 'third-party/v8-patches/**'

permissions:
  actions: read
  contents: read

jobs:
  metadata:
    if: inputs.consumer_recheck_run_id == ''
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
    - uses: actions/checkout@v4
    - name: Test cross-RID evidence verifier
      run: |
        python3 -m unittest \
          scripts/tests/test_linux_build_policy.py \
          scripts/tests/test_verify_linux_native_abi.py \
          scripts/tests/test_verify_native_payload_reproducibility.py \
          scripts/tests/test_verify_cross_rid_compatibility.py
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x
    - id: version
      name: Resolve and validate package version
      shell: bash
      env:
        REQUESTED_PUBLISH: ${{ inputs.publish }}
      run: |
        version="$(
          dotnet msbuild src/WebScene.Core/WebScene.Core.csproj \
            -getProperty:PackageVersion -nologo |
            tail -n 1 | tr -d '\r'
        )"
        publish="${REQUESTED_PUBLISH:-false}"
        if [[ "$GITHUB_REF_TYPE" == tag ]]; then
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$version" ]]; then
            echo "Tag version '$tag_version' does not match repository PackageVersion '$version'." >&2
            exit 1
          fi
          publish=true
        fi
        if [[ -z "$version" ]]; then
          echo "Unable to resolve the repository package version." >&2
          exit 1
        fi
        echo "package-version=$version" >> "$GITHUB_OUTPUT"
        echo "publish=$publish" >> "$GITHUB_OUTPUT"

  release-ci-gate:
    name: Require successful CI for release commit
    needs: metadata
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Require successful CI for the exact commit
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        IFS=$'\t' read -r conclusion url <<< "$(
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow CI.yml \
            --commit "$GITHUB_SHA" \
            --event push \
            --status completed \
            --limit 20 \
            --json conclusion,url,databaseId \
            --jq '(sort_by(.databaseId) | last // {}) | [(.conclusion // "missing"), (.url // "")] | @tsv'
        )"
        if [[ "$conclusion" != success ]]; then
          echo "The exact release commit '$GITHUB_SHA' has no successful completed CI push run (latest conclusion: '$conclusion')." >&2
          exit 1
        fi
        echo "Release CI gate passed: $url"

  packages:
    name: Pack .NET packages
    needs: metadata
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x
    - name: Pack and verify .NET packages
      shell: bash
      run: |
        scripts/pack-packages.sh \
          --package-version '${{ needs.metadata.outputs.package-version }}' \
          --output "$GITHUB_WORKSPACE/artifacts/nuget-packages"
    - name: Upload .NET packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ needs.metadata.outputs.package-version }}
        path: |
          artifacts/nuget-packages/*.nupkg
          artifacts/nuget-packages/*.snupkg
          artifacts/nuget-packages/packages.json
        if-no-files-found: error

  linux-builder:
    name: Build immutable Linux cross-builder
    needs: metadata
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
      arm64-finalizer-image: ${{ steps.finalizer-reference.outputs.image }}
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: build
      name: Build pinned Linux cross-builder
      uses: docker/build-push-action@v6
      with:
        context: packaging/WebScene.NativeEngine.Runtime
        file: packaging/WebScene.NativeEngine.Runtime/Dockerfile.linux-glibc
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/scenetech/webscene-linux-builder:webscene-linux-glibc-v1
    - id: reference
      name: Resolve immutable builder reference
      if: github.event_name != 'pull_request'
      shell: bash
      run: echo "image=ghcr.io/scenetech/webscene-linux-builder@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
    - id: finalizer-build
      name: Build pinned Linux ARM64 finalizer
      uses: docker/build-push-action@v6
      with:
        context: packaging/WebScene.NativeEngine.Runtime
        file: packaging/WebScene.NativeEngine.Runtime/Dockerfile.linux-arm64-finalizer
        platforms: linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        load: ${{ github.event_name == 'pull_request' }}
        tags: ghcr.io/scenetech/webscene-linux-arm64-finalizer:webscene-linux-glibc-v1
    - id: finalizer-reference
      name: Resolve immutable ARM64 finalizer reference
      shell: bash
      run: |
        if [[ '${{ github.event_name }}' == pull_request ]]; then
          echo "image=ghcr.io/scenetech/webscene-linux-arm64-finalizer:webscene-linux-glibc-v1" >> "$GITHUB_OUTPUT"
        else
          echo "image=ghcr.io/scenetech/webscene-linux-arm64-finalizer@${{ steps.finalizer-build.outputs.digest }}" >> "$GITHUB_OUTPUT"
        fi

  native:
    name: Build ${{ matrix.rid }}
    needs: [metadata, linux-builder]
    permissions:
      actions: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: [self-hosted, macOS, ARM64]
          rid: osx-arm64
          dotnet_architecture: arm64
          cpu: arm64
          monolith: libv8_monolith.a
          script: unix
          v8_revision: 15.3.10
          partition_alloc: true
          v8_configuration: ReleasePartitionAlloc
          v8_cache_generation: v10-v8-15.3.10-pa-system-libcxx-macos-inspector
          v8_cache_extra_paths: ''
          v8_cache_script: scripts/build-native-engine-runtime.sh
          v8_cache_patch: packaging/WebScene.NativeEngine.Runtime/patches/V8PartitionAllocMacVisibilityPatch.txt
        - os: [self-hosted, macOS, ARM64]
          rid: osx-x64
          dotnet_architecture: x64
          cpu: x64
          monolith: libv8_monolith.a
          script: unix
          v8_revision: 15.3.10
          partition_alloc: true
          v8_configuration: ReleasePartitionAlloc
          v8_cache_generation: v10-v8-15.3.10-pa-system-libcxx-macos-inspector
          v8_cache_extra_paths: ''
          v8_cache_script: scripts/build-native-engine-runtime.sh
          v8_cache_patch: packaging/WebScene.NativeEngine.Runtime/patches/V8PartitionAllocMacVisibilityPatch.txt
        - os: [self-hosted, Linux, X64]
          rid: linux-x64
          dotnet_architecture: x64
          cpu: x64
          monolith: libv8_monolith.a
          script: unix
          v8_revision: 15.3.10
          partition_alloc: true
          v8_configuration: ReleasePartitionAlloc
          v8_cache_generation: v2-v8-15.3.10-glibc227-cross-x64
          v8_cache_extra_paths: |
            artifacts/native-engine-v8/linux-*/v8/buildtools/third_party/libc++
            artifacts/native-engine-v8/linux-*/v8/out/*/*/obj/buildtools/third_party/libc++abi/libc++abi.a
            artifacts/native-engine-v8/linux-*/v8/third_party/libc++/src/include
            artifacts/native-engine-v8/linux-*/v8/third_party/libc++abi/src/include
            artifacts/native-engine-v8/linux-*/v8/third_party/llvm-build/Release+Asserts
          v8_cache_script: scripts/build-native-engine-runtime.sh
          v8_cache_patch: packaging/WebScene.NativeEngine.Runtime/patches/V8BuildNoCrelPatch.txt
        - os: [self-hosted, Linux, X64]
          rid: linux-arm64
          dotnet_architecture: x64
          cpu: arm64
          monolith: libv8_monolith.a
          script: unix
          v8_revision: 15.3.10
          partition_alloc: true
          v8_configuration: ReleasePartitionAlloc
          v8_cache_generation: v3-v8-15.3.10-glibc227-cross-arm64
          v8_cache_extra_paths: |
            artifacts/native-engine-v8/linux-*/v8/buildtools/third_party/libc++
            artifacts/native-engine-v8/linux-*/v8/out/*/*/obj/buildtools/third_party/libc++abi/libc++abi.a
            artifacts/native-engine-v8/linux-*/v8/third_party/libc++/src/include
            artifacts/native-engine-v8/linux-*/v8/third_party/libc++abi/src/include
            artifacts/native-engine-v8/linux-*/v8/third_party/llvm-build/Release+Asserts
          v8_cache_script: scripts/build-native-engine-runtime.sh
          v8_cache_patch: packaging/WebScene.NativeEngine.Runtime/patches/V8BuildNoCrelPatch.txt
        - os: windows-2022
          rid: win-x64
          dotnet_architecture: x64
          cpu: x64
          monolith: v8_monolith.lib
          script: windows
          v8_revision: 15.3.10
          partition_alloc: true
          v8_configuration: ReleasePartitionAlloc
          v8_cache_generation: v9-v8-15.3.10-pa-windows-compat-inspector
          v8_cache_extra_paths: ''
          v8_cache_script: scripts/build-native-engine-runtime.ps1
          v8_cache_patch: packaging/WebScene.NativeEngine.Runtime/patches/V8WindowsCompatibilityPatch.txt
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x
        architecture: ${{ matrix.dotnet_architecture }}
    - id: v8-cache-key
      name: Resolve pinned V8 SDK cache identity
      shell: bash
      run: |
        echo "image-version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    - id: v8-cache
      name: Restore pinned V8 SDK
      if: github.ref_type != 'tag'
      uses: actions/cache/restore@v4
      with:
        path: |
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/include
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/args.gn
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/obj/${{ matrix.monolith }}
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/obj/buildtools/third_party/libc++/libc++.a
          ${{ matrix.v8_cache_extra_paths }}
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/icudtl.dat
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/gen/third_party/partition_alloc/src
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/LICENSE
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/third_party/icu/LICENSE
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/third_party/partition_alloc/src
        key: webscene-v8-sdk-${{ matrix.v8_cache_generation }}-${{ matrix.rid }}-${{ hashFiles('third-party/v8-patches/**') }}-${{ steps.v8-cache-key.outputs.image-version }}-${{ hashFiles(matrix.v8_cache_script, matrix.v8_cache_patch, 'packaging/WebScene.NativeEngine.Runtime/patches/V8PartitionAllocGlibc227Arm64Patch.txt', 'packaging/WebScene.NativeEngine.Runtime/patches/V8LibcxxMemoryResourcePatch.txt', 'packaging/WebScene.NativeEngine.Runtime/Dockerfile.linux-glibc', 'packaging/WebScene.NativeEngine.Runtime/linux-build-lock.json', 'scripts/linux-glibc-toolchain.cmake') }}
        restore-keys: |
          webscene-v8-sdk-${{ matrix.v8_cache_generation }}-${{ matrix.rid }}-${{ hashFiles('third-party/v8-patches/**') }}-
          webscene-v8-sdk-${{ matrix.v8_cache_generation }}-${{ matrix.rid }}-
    - id: restored-v8-sdk
      name: Validate restored V8 SDK compatibility
      shell: bash
      run: |
        root="artifacts/native-engine-v8/${{ matrix.rid }}/v8"
        args="$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/args.gn"
        monolith="$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/obj/${{ matrix.monolith }}"
        partition_alloc_is_compatible() {
          [[ '${{ matrix.partition_alloc }}' != 'true' ]] \
            || { [[ -d "$root/third_party/partition_alloc/src" ]] \
              && [[ -f "$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/gen/third_party/partition_alloc/src/partition_alloc/buildflags.h" ]]; }
        }
        libcxx_is_compatible() {
          archive_is_regular() {
            [[ -f "$1" ]] && [[ "$(head -c 7 "$1")" == '!<arch>' ]]
          }
          archive_has_memory_resource() {
            "$root/third_party/llvm-build/Release+Asserts/bin/llvm-ar" t "$1" \
              | grep -Eq '(^|/)memory_resource\.o$'
          }
          [[ '${{ matrix.rid }}' != linux-* ]] \
            || { archive_is_regular "$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/obj/buildtools/third_party/libc++/libc++.a" \
              && archive_is_regular "$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/obj/buildtools/third_party/libc++abi/libc++abi.a" \
              && archive_has_memory_resource "$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/obj/buildtools/third_party/libc++/libc++.a" \
              && [[ -f "$root/buildtools/third_party/libc++/__config_site" ]] \
              && [[ -f "$root/buildtools/third_party/libc++/__assertion_handler" ]] \
              && [[ -f "$root/third_party/libc++/src/include/source_location" ]] \
              && [[ -f "$root/third_party/libc++abi/src/include/cxxabi.h" ]] \
              && [[ -x "$root/third_party/llvm-build/Release+Asserts/bin/clang++" ]] \
              && [[ -x "$root/third_party/llvm-build/Release+Asserts/bin/ld.lld" ]]; }
        }
        args_are_compatible() {
          grep -Eq '^v8_enable_pointer_compression *= *true$' "$args" \
            && grep -Eq '^v8_enable_pointer_compression_shared_cage *= *true$' "$args" \
            && grep -Eq '^v8_enable_partition_alloc *= *${{ matrix.partition_alloc }}$' "$args" \
            && { [[ '${{ matrix.partition_alloc }}' != 'true' ]] \
              || [[ '${{ matrix.rid }}' == 'win-x64' ]] \
              || { grep -Eq '^use_allocator_shim *= *false$' "$args" \
                && grep -Eq '^use_partition_alloc_as_malloc *= *false$' "$args"; }; } \
            && { [[ '${{ matrix.rid }}' != linux-* ]] \
              || { grep -Eq '^use_lld *= *true$' "$args" \
                && grep -Eq '^use_sysroot *= *true$' "$args" \
                && grep -Eq '^v8_monolithic_for_shared_library *= *true$' "$args" \
                && grep -Eq '^use_custom_libcxx *= *true$' "$args"; }; } \
            && { [[ '${{ matrix.rid }}' != osx-* ]] \
              || grep -Eq '^use_custom_libcxx *= *false$' "$args"; }
        }
        if [[ -f "$root/include/v8.h" \
          && -f "$root/include/v8-inspector.h" \
          && $(grep -c 'virtual void consoleAPICalled' "$root/include/v8-inspector.h") -gt 0 \
          && -f "$args" \
          && -f "$monolith" \
          && -f "$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/icudtl.dat" \
          && -f "$root/LICENSE" \
          && -f "$root/third_party/icu/LICENSE" ]] \
          && args_are_compatible \
          && partition_alloc_is_compatible \
          && libcxx_is_compatible; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [[ -d "$root" ]]; then
            echo "Discarding an incomplete or incompatible restored V8 SDK at '$root'."
            rm -rf "$root"
          fi
        fi
    - name: Build, pack, and test macOS runtime
      if: startsWith(matrix.rid, 'osx-')
      shell: bash
      run: |
        v8_root=
        restored_v8="$GITHUB_WORKSPACE/artifacts/native-engine-v8/${{ matrix.rid }}/v8"
        if [[ '${{ steps.restored-v8-sdk.outputs.ready }}' == 'true' ]]; then
          v8_root="$restored_v8"
        fi
        scripts/build-native-engine-runtime.sh \
          --rid '${{ matrix.rid }}' \
          --package-version '${{ needs.metadata.outputs.package-version }}' \
          --v8-root "$v8_root" \
          --v8-revision '${{ matrix.v8_revision }}' \
          --upstream-v8 \
          --partition-alloc \
          --output "$GITHUB_WORKSPACE/artifacts/nuget-packages"
    - name: Build Linux runtime
      if: startsWith(matrix.rid, 'linux-')
      shell: bash
      run: |
        builder_args=()
        if [[ -n '${{ needs.linux-builder.outputs.image }}' ]]; then
          builder_args+=(--builder-image '${{ needs.linux-builder.outputs.image }}')
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
        fi
        scripts/build-linux-native-runtime.sh \
          --rid '${{ matrix.rid }}' \
          --package-version '${{ needs.metadata.outputs.package-version }}' \
          --output "$GITHUB_WORKSPACE/artifacts/nuget-packages" \
          --stage build \
          "${builder_args[@]}"
    - name: Build, pack, and test Windows runtime
      if: matrix.script == 'windows'
      shell: pwsh
      run: |
        $v8Root = ""
        $restoredV8 = "$env:GITHUB_WORKSPACE/artifacts/native-engine-v8/${{ matrix.rid }}/v8"
        if ('${{ steps.restored-v8-sdk.outputs.ready }}' -eq 'true') {
          $v8Root = $restoredV8
        }
        ./scripts/build-native-engine-runtime.ps1 `
          -Rid '${{ matrix.rid }}' `
          -PackageVersion '${{ needs.metadata.outputs.package-version }}' `
          -V8Root $v8Root `
          -V8Revision '${{ matrix.v8_revision }}' `
          -UpstreamV8 `
          -PartitionAlloc `
          -Output "$env:GITHUB_WORKSPACE/artifacts/nuget-packages"
    - name: Run candidate compatibility discovery
      if: matrix.rid != 'linux-arm64'
      continue-on-error: true
      shell: bash
      run: |
        case '${{ matrix.rid }}' in
          osx-arm64|osx-x64) native_name=libwebscene_native_engine.dylib ;;
          linux-x64|linux-arm64) native_name=libwebscene_native_engine.so ;;
          win-x64) native_name=webscene_native_engine.dll ;;
          *) echo "Unsupported discovery RID '${{ matrix.rid }}'." >&2; exit 1 ;;
        esac
        native_path="$(
          find artifacts/native-engine-runtime-build \
            -path "*/package-smoke/runtimes/${{ matrix.rid }}/native/$native_name" \
            -print -quit
        )"
        if [[ -z "$native_path" ]]; then
          echo "Unable to locate the packaged ${{ matrix.rid }} native runtime." >&2
          exit 1
        fi
        build_dir="${native_path%%/package-smoke/runtimes/*}"
        runner_args=(
          dotnet run
          --project tests/WebPlatformSubset/runner/WebScene.WebPlatformSubset.Runner.csproj
          -c Release -f net10.0 --no-build --disable-build-servers --
          --selection candidate
          --native-library "$native_path"
          --native-cache-directory "$build_dir/code-cache"
          --output "$build_dir/wpt-candidate-results")
        if [[ '${{ matrix.rid }}' == 'linux-x64' ]]; then
          docker run --rm \
            --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/webscene-home \
            --env DOTNET_CLI_HOME=/tmp/webscene-home \
            --env NUGET_PACKAGES=/tmp/webscene-home/.nuget/packages \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            '${{ needs.linux-builder.outputs.image }}' \
            "${runner_args[@]}"
        else
          "${runner_args[@]}"
        fi
    - id: v8-sdk-ready
      name: Validate completed V8 SDK for caching
      if: always() && steps.v8-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        root="artifacts/native-engine-v8/${{ matrix.rid }}/v8"
        args="$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/args.gn"
        monolith="$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/obj/${{ matrix.monolith }}"
        partition_alloc_is_compatible() {
          [[ '${{ matrix.partition_alloc }}' != 'true' ]] \
            || { [[ -d "$root/third_party/partition_alloc/src" ]] \
              && [[ -f "$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/gen/third_party/partition_alloc/src/partition_alloc/buildflags.h" ]]; }
        }
        libcxx_is_compatible() {
          archive_is_regular() {
            [[ -f "$1" ]] && [[ "$(head -c 7 "$1")" == '!<arch>' ]]
          }
          archive_has_memory_resource() {
            "$root/third_party/llvm-build/Release+Asserts/bin/llvm-ar" t "$1" \
              | grep -Eq '(^|/)memory_resource\.o$'
          }
          [[ '${{ matrix.rid }}' != linux-* ]] \
            || { archive_is_regular "$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/obj/buildtools/third_party/libc++/libc++.a" \
              && archive_is_regular "$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/obj/buildtools/third_party/libc++abi/libc++abi.a" \
              && archive_has_memory_resource "$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/obj/buildtools/third_party/libc++/libc++.a" \
              && [[ -f "$root/buildtools/third_party/libc++/__config_site" ]] \
              && [[ -f "$root/buildtools/third_party/libc++/__assertion_handler" ]] \
              && [[ -f "$root/third_party/libc++/src/include/source_location" ]] \
              && [[ -f "$root/third_party/libc++abi/src/include/cxxabi.h" ]] \
              && [[ -x "$root/third_party/llvm-build/Release+Asserts/bin/clang++" ]] \
              && [[ -x "$root/third_party/llvm-build/Release+Asserts/bin/ld.lld" ]]; }
        }
        args_are_compatible() {
          grep -Eq '^v8_enable_pointer_compression *= *true$' "$args" \
            && grep -Eq '^v8_enable_pointer_compression_shared_cage *= *true$' "$args" \
            && grep -Eq '^v8_enable_partition_alloc *= *${{ matrix.partition_alloc }}$' "$args" \
            && { [[ '${{ matrix.rid }}' != linux-* ]] \
              || { grep -Eq '^use_lld *= *true$' "$args" \
                && grep -Eq '^use_sysroot *= *true$' "$args" \
                && grep -Eq '^v8_monolithic_for_shared_library *= *true$' "$args" \
                && grep -Eq '^use_custom_libcxx *= *true$' "$args" \
                && grep -Eq '^use_allocator_shim *= *false$' "$args" \
                && grep -Eq '^use_partition_alloc_as_malloc *= *false$' "$args"; }; } \
            && { [[ '${{ matrix.rid }}' != osx-* ]] \
              || grep -Eq '^use_custom_libcxx *= *false$' "$args"; }
        }
        if [[ -f "$root/include/v8.h" \
          && -f "$root/include/v8-inspector.h" \
          && $(grep -c 'virtual void consoleAPICalled' "$root/include/v8-inspector.h") -gt 0 \
          && -f "$args" \
          && -f "$monolith" \
          && -f "$root/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/icudtl.dat" \
          && -f "$root/LICENSE" \
          && -f "$root/third_party/icu/LICENSE" ]] \
          && args_are_compatible \
          && partition_alloc_is_compatible \
          && libcxx_is_compatible; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "ready=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Save completed V8 SDK
      if: always() && github.ref_type != 'tag' && steps.v8-sdk-ready.outputs.ready == 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/include
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/args.gn
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/obj/${{ matrix.monolith }}
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/obj/buildtools/third_party/libc++/libc++.a
          ${{ matrix.v8_cache_extra_paths }}
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/icudtl.dat
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/out/${{ matrix.cpu }}/${{ matrix.v8_configuration }}/gen/third_party/partition_alloc/src
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/LICENSE
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/third_party/icu/LICENSE
          artifacts/native-engine-v8/${{ matrix.rid }}/v8/third_party/partition_alloc/src
        key: webscene-v8-sdk-${{ matrix.v8_cache_generation }}-${{ matrix.rid }}-${{ hashFiles('third-party/v8-patches/**') }}-${{ steps.v8-cache-key.outputs.image-version }}-${{ hashFiles(matrix.v8_cache_script, matrix.v8_cache_patch, 'packaging/WebScene.NativeEngine.Runtime/patches/V8PartitionAllocGlibc227Arm64Patch.txt', 'packaging/WebScene.NativeEngine.Runtime/patches/V8LibcxxMemoryResourcePatch.txt', 'packaging/WebScene.NativeEngine.Runtime/Dockerfile.linux-glibc', 'packaging/WebScene.NativeEngine.Runtime/linux-build-lock.json', 'scripts/linux-glibc-toolchain.cmake') }}
    - name: Upload required compatibility evidence
      if: success() && matrix.rid != 'linux-arm64'
      uses: actions/upload-artifact@v4
      with:
        name: compatibility-required-${{ matrix.rid }}-${{ needs.metadata.outputs.package-version }}
        path: artifacts/native-engine-runtime-build/**/wpt-results/**
        if-no-files-found: error
    - name: Upload failed compatibility evidence
      if: failure() && matrix.rid != 'linux-arm64'
      uses: actions/upload-artifact@v4
      with:
        name: compatibility-required-${{ matrix.rid }}-${{ needs.metadata.outputs.package-version }}
        path: artifacts/native-engine-runtime-build/**/wpt-results/**
        if-no-files-found: warn
    - name: Upload candidate compatibility evidence
      if: always() && matrix.rid != 'linux-arm64'
      uses: actions/upload-artifact@v4
      with:
        name: compatibility-candidate-${{ matrix.rid }}-${{ needs.metadata.outputs.package-version }}
        path: artifacts/native-engine-runtime-build/**/wpt-candidate-results/**
        if-no-files-found: warn
    - name: Upload verified RID package
      if: matrix.rid != 'linux-arm64'
      uses: actions/upload-artifact@v4
      with:
        name: native-${{ matrix.rid }}-${{ needs.metadata.outputs.package-version }}
        path: |
          artifacts/nuget-packages/*.nupkg
          artifacts/native-engine-runtime-build/**/*-abi.json
        if-no-files-found: error
    - name: Upload ARM64 cross-build stage
      if: matrix.rid == 'linux-arm64'
      uses: actions/upload-artifact@v4
      with:
        name: cross-stage-linux-arm64-${{ needs.metadata.outputs.package-version }}
        path: |
          artifacts/native-engine-runtime-build/linux-arm64-*/**
          artifacts/native-engine-v8/linux-arm64/v8/include/**
          artifacts/native-engine-v8/linux-arm64/v8/out/arm64/ReleasePartitionAlloc/**
          artifacts/native-engine-v8/linux-arm64/v8/LICENSE
          artifacts/native-engine-v8/linux-arm64/v8/third_party/icu/LICENSE
          artifacts/native-engine-v8/linux-arm64/v8/third_party/partition_alloc/src/**
        if-no-files-found: error
        retention-days: 3

  linux-arm64-finalize:
    name: Finalize and test linux-arm64
    needs: [metadata, linux-builder, native]
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: read
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Download ARM64 cross-build stage
      uses: actions/download-artifact@v4
      with:
        name: cross-stage-linux-arm64-${{ needs.metadata.outputs.package-version }}
        path: artifacts
    - name: Restore executable permissions
      shell: bash
      run: |
        find artifacts/native-engine-runtime-build/linux-arm64-* -type f \
          \( -name 'webscene_*' -o -name '*_tests' \) -exec chmod +x {} +
    - name: Generate snapshot, test, and package under ARM64 emulation
      shell: bash
      run: |
        docker run --rm \
          --platform linux/arm64 \
          --user "$(id -u):$(id -g)" \
          --env HOME=/tmp/webscene-home \
          --env DOTNET_CLI_HOME=/tmp/webscene-home \
          --env NUGET_PACKAGES=/tmp/webscene-home/.nuget/packages \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --workdir /workspace \
          '${{ needs.linux-builder.outputs.arm64-finalizer-image }}' \
          scripts/build-linux-native-runtime.sh \
            --rid linux-arm64 \
            --package-version '${{ needs.metadata.outputs.package-version }}' \
            --output /workspace/artifacts/nuget-packages \
            --stage finalize
        native_path="$(find artifacts/native-engine-runtime-build -path '*/linux-arm64-*/libwebscene_native_engine.so' -print -quit)"
        python3 scripts/verify-linux-native-abi.py "$native_path" \
          --rid linux-arm64 \
          --output "${native_path%/*}/linux-arm64-abi.json"
    - name: Run ARM64 candidate compatibility discovery
      continue-on-error: true
      shell: bash
      run: |
        native_path="$(find artifacts/native-engine-runtime-build -path '*/package-smoke/runtimes/linux-arm64/native/libwebscene_native_engine.so' -print -quit)"
        build_dir="${native_path%%/package-smoke/runtimes/*}"
        docker run --rm \
          --platform linux/arm64 \
          --user "$(id -u):$(id -g)" \
          --env HOME=/tmp/webscene-home \
          --env DOTNET_CLI_HOME=/tmp/webscene-home \
          --env NUGET_PACKAGES=/tmp/webscene-home/.nuget/packages \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --workdir /workspace \
          '${{ needs.linux-builder.outputs.arm64-finalizer-image }}' \
          dotnet run \
            --project tests/WebPlatformSubset/runner/WebScene.WebPlatformSubset.Runner.csproj \
            -c Release -f net10.0 --no-build -- \
            --selection candidate \
            --native-library "$native_path" \
            --native-cache-directory "$build_dir/code-cache" \
            --output "$build_dir/wpt-candidate-results"
    - name: Upload ARM64 required compatibility evidence
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: compatibility-required-linux-arm64-${{ needs.metadata.outputs.package-version }}
        path: artifacts/native-engine-runtime-build/**/wpt-results/**
        if-no-files-found: error
    - name: Upload ARM64 candidate compatibility evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: compatibility-candidate-linux-arm64-${{ needs.metadata.outputs.package-version }}
        path: artifacts/native-engine-runtime-build/**/wpt-candidate-results/**
        if-no-files-found: warn
    - name: Upload verified ARM64 package and ABI evidence
      uses: actions/upload-artifact@v4
      with:
        name: native-linux-arm64-${{ needs.metadata.outputs.package-version }}
        path: |
          artifacts/nuget-packages/*.nupkg
          artifacts/native-engine-runtime-build/**/*-abi.json
        if-no-files-found: error

  required-evidence:
    name: Verify cross-RID required evidence
    needs: [metadata, native, linux-arm64-finalize]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download required compatibility evidence
      uses: actions/download-artifact@v4
      with:
        pattern: compatibility-required-*
        path: artifacts/required-compatibility
    - name: Verify exact required profile across released RIDs
      run: |
        python3 scripts/verify-cross-rid-compatibility.py \
          --input-root artifacts/required-compatibility \
          --profile tests/WebPlatformSubset/webscene-component-profile.json \
          --selection required \
          --expected-rid osx-arm64 \
          --expected-rid osx-x64 \
          --expected-rid linux-arm64 \
          --expected-rid linux-x64 \
          --expected-rid win-x64 \
          --output artifacts/required-compatibility/cross-rid-summary.json
    - name: Upload cross-RID required summary
      uses: actions/upload-artifact@v4
      with:
        name: compatibility-required-summary-${{ needs.metadata.outputs.package-version }}
        path: artifacts/required-compatibility/cross-rid-summary.json
        if-no-files-found: error

  package-set:
    name: Verify release package set
    needs: [metadata, packages, native, linux-arm64-finalize, required-evidence]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download .NET packages
      uses: actions/download-artifact@v4
      with:
        name: packages-${{ needs.metadata.outputs.package-version }}
        path: artifacts/nuget-packages
    - name: Download native packages
      uses: actions/download-artifact@v4
      with:
        pattern: native-*-${{ needs.metadata.outputs.package-version }}
        path: artifacts
        merge-multiple: true
    - name: Verify versions, dependencies, symbols, and package inventory
      shell: bash
      run: |
        python3 scripts/verify-release-packages.py \
          artifacts/nuget-packages \
          --version '${{ needs.metadata.outputs.package-version }}' \
          --native-rid osx-arm64 \
          --native-rid osx-x64 \
          --native-rid linux-arm64 \
          --native-rid linux-x64 \
          --native-rid win-x64 \
          --output artifacts/nuget-packages/release-packages.json
        shasum -a 256 \
          artifacts/nuget-packages/*.nupkg \
          artifacts/nuget-packages/*.snupkg \
          > artifacts/nuget-packages/packages.sha256
    - name: Upload complete verified package set
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ needs.metadata.outputs.package-version }}
        path: |
          artifacts/nuget-packages/*.nupkg
          artifacts/nuget-packages/*.snupkg
          artifacts/nuget-packages/*.json
          artifacts/nuget-packages/packages.sha256
        if-no-files-found: error

  candidate-evidence:
    name: Verify cross-RID candidate evidence
    needs: [metadata, native, linux-arm64-finalize]
    if: always() && needs.metadata.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download candidate compatibility evidence
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: compatibility-candidate-*
        path: artifacts/candidate-compatibility
    - name: Verify exact candidate profile across released RIDs
      if: always()
      run: |
        python3 scripts/verify-cross-rid-compatibility.py \
          --input-root artifacts/candidate-compatibility \
          --profile tests/WebPlatformSubset/webscene-component-profile.json \
          --selection candidate \
          --expected-rid osx-arm64 \
          --expected-rid osx-x64 \
          --expected-rid linux-arm64 \
          --expected-rid linux-x64 \
          --expected-rid win-x64 \
          --output artifacts/candidate-compatibility/cross-rid-summary.json
    - name: Upload cross-RID candidate summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: compatibility-candidate-summary-${{ needs.metadata.outputs.package-version }}
        path: artifacts/candidate-compatibility/cross-rid-summary.json
        if-no-files-found: warn

  consumer:
    name: Package consumer ${{ matrix.rid }}
    needs: [metadata, package-set, linux-builder]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: [self-hosted, macOS, ARM64]
          rid: osx-arm64
          dotnet_architecture: arm64
        - os: [self-hosted, macOS, ARM64]
          rid: osx-x64
          dotnet_architecture: x64
        - os: [self-hosted, Linux, X64]
          rid: linux-x64
          dotnet_architecture: x64
        - os: [self-hosted, Linux, X64]
          rid: linux-arm64
          dotnet_architecture: x64
        - os: windows-2022
          rid: win-x64
          dotnet_architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      if: matrix.rid != 'linux-arm64'
      uses: actions/setup-dotnet@v5
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x
        architecture: ${{ matrix.dotnet_architecture }}
    - name: Set up ARM64 emulation
      if: matrix.rid == 'linux-arm64'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - name: Log in to GitHub Container Registry
      if: matrix.rid == 'linux-arm64'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Download verified package set
      uses: actions/download-artifact@v4
      with:
        name: release-${{ needs.metadata.outputs.package-version }}
        path: artifacts/nuget-packages
    - name: Restore clean package consumer
      if: matrix.rid != 'linux-arm64'
      shell: bash
      run: |
        dotnet restore tests/WebScene.Runtime.PackageSmoke/WebScene.Runtime.PackageSmoke.csproj \
          -p:TargetFramework=net10.0 \
          -p:RuntimeIdentifier='${{ matrix.rid }}' \
          -p:WebScenePackageVersion='${{ needs.metadata.outputs.package-version }}' \
          --configfile tests/WebScene.Runtime.PackageSmoke/NuGet.config \
          --disable-build-servers
        dotnet restore tests/WebScene.Uno.PackageSmoke/WebScene.Uno.PackageSmoke.csproj \
          -p:RuntimeIdentifier='${{ matrix.rid }}' \
          -p:WebScenePackageVersion='${{ needs.metadata.outputs.package-version }}' \
          --configfile tests/WebScene.Uno.PackageSmoke/NuGet.config \
          --disable-build-servers
    - name: Build and run clean package consumer
      if: matrix.rid != 'linux-arm64'
      shell: bash
      run: |
        dotnet run \
          --project tests/WebScene.Runtime.PackageSmoke/WebScene.Runtime.PackageSmoke.csproj \
          -c Release -f net10.0 \
          -r '${{ matrix.rid }}' \
          --no-restore \
          --disable-build-servers \
          -p:WebScenePackageVersion='${{ needs.metadata.outputs.package-version }}'
        dotnet run \
          --project tests/WebScene.Uno.PackageSmoke/WebScene.Uno.PackageSmoke.csproj \
          -c Release \
          -r '${{ matrix.rid }}' \
          --no-restore \
          --disable-build-servers \
          -p:WebScenePackageVersion='${{ needs.metadata.outputs.package-version }}'
    - name: Restore, build, and run ARM64 package consumer under emulation
      if: matrix.rid == 'linux-arm64'
      shell: bash
      run: |
        docker run --rm \
          --platform linux/arm64 \
          --user "$(id -u):$(id -g)" \
          --env HOME=/tmp/webscene-home \
          --env DOTNET_CLI_HOME=/tmp/webscene-home \
          --env NUGET_PACKAGES=/tmp/webscene-home/.nuget/packages \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --workdir /workspace \
          '${{ needs.linux-builder.outputs.arm64-finalizer-image }}' \
          bash -euo pipefail -c '
            dotnet restore tests/WebScene.Runtime.PackageSmoke/WebScene.Runtime.PackageSmoke.csproj \
              -p:TargetFramework=net10.0 \
              -p:RuntimeIdentifier=linux-arm64 \
              -p:WebScenePackageVersion=${{ needs.metadata.outputs.package-version }} \
              --configfile tests/WebScene.Runtime.PackageSmoke/NuGet.config \
              --disable-build-servers
            dotnet restore tests/WebScene.Uno.PackageSmoke/WebScene.Uno.PackageSmoke.csproj \
              -p:RuntimeIdentifier=linux-arm64 \
              -p:WebScenePackageVersion=${{ needs.metadata.outputs.package-version }} \
              --configfile tests/WebScene.Runtime.PackageSmoke/NuGet.config \
              --disable-build-servers
            dotnet run --project tests/WebScene.Runtime.PackageSmoke/WebScene.Runtime.PackageSmoke.csproj \
              -c Release -f net10.0 -r linux-arm64 --no-restore --disable-build-servers \
              -p:WebScenePackageVersion=${{ needs.metadata.outputs.package-version }}
            dotnet run --project tests/WebScene.Uno.PackageSmoke/WebScene.Uno.PackageSmoke.csproj \
              -c Release -r linux-arm64 --no-restore --disable-build-servers \
              -p:WebScenePackageVersion=${{ needs.metadata.outputs.package-version }}'

  linux-floor-smoke:
    name: Linux floor ${{ matrix.distribution }} ${{ matrix.rid }}
    needs: [metadata, package-set]
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: [self-hosted, Linux, X64]
          rid: linux-x64
          platform: linux/amd64
          distribution: ubuntu-18.04
          image: ubuntu:18.04
        - os: [self-hosted, Linux, X64]
          rid: linux-arm64
          platform: linux/arm64
          distribution: ubuntu-18.04
          image: ubuntu:18.04
        - os: [self-hosted, Linux, X64]
          rid: linux-x64
          platform: linux/amd64
          distribution: ubi-8.9
          image: registry.access.redhat.com/ubi8/ubi:8.9
        - os: [self-hosted, Linux, X64]
          rid: linux-arm64
          platform: linux/arm64
          distribution: ubi-8.9
          image: registry.access.redhat.com/ubi8/ubi:8.9
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up ARM64 emulation
      if: matrix.platform == 'linux/arm64'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - uses: actions/download-artifact@v4
      with:
        name: release-${{ needs.metadata.outputs.package-version }}
        path: artifacts/nuget-packages
    - name: Extract native package
      shell: bash
      run: |
        mkdir -p artifacts/linux-floor-smoke
        unzip -q \
          "artifacts/nuget-packages/WebScene.NativeEngine.Runtime.${{ matrix.rid }}.${{ needs.metadata.outputs.package-version }}.nupkg" \
          -d artifacts/linux-floor-smoke
    - name: Load native runtime on support floor
      shell: bash
      run: |
        docker run --rm \
          --platform '${{ matrix.platform }}' \
          --volume "$GITHUB_WORKSPACE:/workspace:ro" \
          --workdir /workspace \
          '${{ matrix.image }}' \
          env LD_PRELOAD="/workspace/artifacts/linux-floor-smoke/runtimes/${{ matrix.rid }}/native/libwebscene_native_engine.so" \
            /bin/true

  linux-compatibility-matrix:
    name: Linux advisory ${{ matrix.distribution }} ${{ matrix.rid }}
    needs: [metadata, package-set]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: [self-hosted, Linux, X64], rid: linux-x64, platform: linux/amd64, distribution: debian-10, image: 'debian:10' }
        - { os: [self-hosted, Linux, X64], rid: linux-arm64, platform: linux/arm64, distribution: debian-10, image: 'debian:10' }
        - { os: [self-hosted, Linux, X64], rid: linux-x64, platform: linux/amd64, distribution: fedora-38, image: 'fedora:38' }
        - { os: [self-hosted, Linux, X64], rid: linux-arm64, platform: linux/arm64, distribution: fedora-38, image: 'fedora:38' }
        - { os: [self-hosted, Linux, X64], rid: linux-x64, platform: linux/amd64, distribution: opensuse-15.5, image: 'opensuse/leap:15.5' }
        - { os: [self-hosted, Linux, X64], rid: linux-arm64, platform: linux/arm64, distribution: opensuse-15.5, image: 'opensuse/leap:15.5' }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up ARM64 emulation
      if: matrix.platform == 'linux/arm64'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - uses: actions/download-artifact@v4
      with:
        name: release-${{ needs.metadata.outputs.package-version }}
        path: artifacts/nuget-packages
    - name: Extract and load native runtime
      shell: bash
      run: |
        mkdir -p artifacts/linux-advisory
        unzip -q \
          "artifacts/nuget-packages/WebScene.NativeEngine.Runtime.${{ matrix.rid }}.${{ needs.metadata.outputs.package-version }}.nupkg" \
          -d artifacts/linux-advisory
        docker run --rm \
          --platform '${{ matrix.platform }}' \
          --volume "$GITHUB_WORKSPACE:/workspace:ro" \
          --workdir /workspace \
          '${{ matrix.image }}' \
          env LD_PRELOAD="/workspace/artifacts/linux-advisory/runtimes/${{ matrix.rid }}/native/libwebscene_native_engine.so" \
            /bin/true
  publish:
    name: Publish to NuGet.org
    needs: [metadata, consumer, linux-floor-smoke, release-ci-gate]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
    - uses: actions/checkout@v4
    - name: Download verified package set
      uses: actions/download-artifact@v4
      with:
        name: release-${{ needs.metadata.outputs.package-version }}
        path: artifacts/nuget-packages
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x
    - id: trusted-publishing
      name: Exchange GitHub identity for a temporary NuGet API key
      if: env.NUGET_API_KEY == '' && env.NUGET_USER != ''
      uses: NuGet/login@v1
      with:
        user: ${{ env.NUGET_USER }}
    - name: Publish packages and symbols
      env:
        TRUSTED_PUBLISHING_API_KEY: ${{ steps.trusted-publishing.outputs.NUGET_API_KEY }}
      shell: bash
      run: |
        api_key="${NUGET_API_KEY:-$TRUSTED_PUBLISHING_API_KEY}"
        if [[ -z "$api_key" ]]; then
          echo "Configure either NUGET_API_KEY or NUGET_USER in the nuget.org environment." >&2
          exit 1
        fi
        for package in artifacts/nuget-packages/*.nupkg; do
          dotnet nuget push "$package" \
            --api-key "$api_key" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        done

  linux-arm64-consumer-recheck:
    name: Recheck package consumer linux-arm64
    if: inputs.consumer_recheck_run_id != ''
    runs-on: [self-hosted, Linux, X64]
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up ARM64 emulation
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - name: Download verified package set
      uses: actions/download-artifact@v4
      with:
        name: release-${{ inputs.consumer_recheck_version }}
        path: artifacts/nuget-packages
        run-id: ${{ inputs.consumer_recheck_run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - id: image
      name: Resolve pinned ARM64 .NET image
      shell: bash
      run: |
        image="$(python3 - <<'PY'
        import json
        from pathlib import Path
        lock = json.loads(Path("packaging/WebScene.NativeEngine.Runtime/linux-build-lock.json").read_text())
        finalizer = lock["arm64Finalizer"]
        print(f'{finalizer["image"]}@{finalizer["digest"]}')
        PY
        )"
        echo "reference=$image" >> "$GITHUB_OUTPUT"
    - name: Restore, build, and run ARM64 package consumer
      shell: bash
      run: |
        docker run --rm \
          --platform linux/arm64 \
          --user "$(id -u):$(id -g)" \
          --env HOME=/tmp/webscene-home \
          --env DOTNET_CLI_HOME=/tmp/webscene-home \
          --env NUGET_PACKAGES=/tmp/webscene-home/.nuget/packages \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --workdir /workspace \
          '${{ steps.image.outputs.reference }}' \
          bash -euo pipefail -c '
            dotnet restore tests/WebScene.Runtime.PackageSmoke/WebScene.Runtime.PackageSmoke.csproj \
              -p:TargetFramework=net10.0 \
              -p:RuntimeIdentifier=linux-arm64 \
              -p:WebScenePackageVersion=${{ inputs.consumer_recheck_version }} \
              --configfile tests/WebScene.Runtime.PackageSmoke/NuGet.config \
              --disable-build-servers
            dotnet restore tests/WebScene.Uno.PackageSmoke/WebScene.Uno.PackageSmoke.csproj \
              -p:RuntimeIdentifier=linux-arm64 \
              -p:WebScenePackageVersion=${{ inputs.consumer_recheck_version }} \
              --configfile tests/WebScene.Runtime.PackageSmoke/NuGet.config \
              --disable-build-servers
            dotnet run --project tests/WebScene.Runtime.PackageSmoke/WebScene.Runtime.PackageSmoke.csproj \
              -c Release -f net10.0 -r linux-arm64 --no-restore --disable-build-servers \
              -p:WebScenePackageVersion=${{ inputs.consumer_recheck_version }}
            dotnet run --project tests/WebScene.Uno.PackageSmoke/WebScene.Uno.PackageSmoke.csproj \
              -c Release -r linux-arm64 --no-restore --disable-build-servers \
              -p:WebScenePackageVersion=${{ inputs.consumer_recheck_version }}'
