name: Apply Runtime headless integration
on:
  push:
    branches: [codex/linux-headless-runtime]
    paths: [.github/workflows/runtime-headless-integrate.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'SceneTech/WebScene' && github.ref == 'refs/heads/codex/linux-headless-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/linux-headless-runtime
      - name: Apply anchored edits and remove the temporary transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script=Path('eng/development/apply-runtime-headless.py')
          text=script.read_text()
          before=r'set\(WEBSCENE_GRAPHICS_ENABLE_ANGLE 0\)'
          after=r'add_compile_definitions\(WEBSCENE_GRAPHICS_ENABLE_ANGLE=0\)'
          assert text.count(before)==1
          script.write_text(text.replace(before,after))
          PY
          python3 eng/development/apply-runtime-headless.py
          python3 -m py_compile eng/sdk/verify-linux-v8.py
          python3 eng/sdk/header-closure.py "$PWD" > /tmp/runtime-sdk-headers.cmake
          git diff --check
          git diff --stat
      - name: Commit implementation, without force or changes to main
        run: |
          git config user.name 'Codex'
          git config user.email 'codex@users.noreply.github.com'
          git add experiments/WebScene.NativeEngine.Probe src/WebScene.Sdk/cmake/WebSceneToolchain.cmake eng/development/apply-runtime-headless.py .github/workflows/runtime-headless-integrate.yml .github/workflows/runtime-headless-bootstrap.yml
          git commit -m 'feat(runtime): connect Linux JavaScript canvases to offscreen Vulkan leases'
          git push origin HEAD:codex/linux-headless-runtime
