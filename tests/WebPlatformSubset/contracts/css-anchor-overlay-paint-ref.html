<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #eee; }
  #workbench { position: relative; width: 300px; height: 200px; }
  #clip { position: absolute; left: 30px; top: 20px; width: 180px; height: 130px; }
  #editor { position: absolute; left: 70px; top: 45px; width: 90px; height: 60px; }
  #clip-root { position: absolute; left: 30px; top: 20px; width: 180px; height: 130px; overflow: hidden; background: #cce; }
  #overlay { position: fixed; left: 70px; top: 45px; width: 90px; height: 60px; background: #080; }
</style>
<div id="workbench"><div id="clip"></div><div id="editor"></div><div id="clip-root"><div id="overlay"></div></div></div>
