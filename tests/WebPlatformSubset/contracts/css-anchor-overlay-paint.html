<!doctype html>
<meta charset="utf-8">
<link rel="match" href="css-anchor-overlay-paint-ref.html">
<style>
  html, body { margin: 0; background: #eee; }
  #workbench { position: relative; width: 300px; height: 200px; }
  #clip { position: absolute; left: 30px; top: 20px; width: 180px; height: 130px; anchor-name: --clip; }
  #editor { position: absolute; left: 70px; top: 45px; width: 90px; height: 60px; anchor-name: --editor; }
  #clip-root { position: absolute; position-anchor: --clip; left: anchor(left); top: anchor(top); width: anchor-size(width); height: anchor-size(height); overflow: hidden; background: #cce; }
  #overlay { position: fixed; position-anchor: --editor; left: anchor(left); top: anchor(top); width: anchor-size(width); height: anchor-size(height); background: #080; }
</style>
<div id="workbench"><div id="clip"></div><div id="editor"></div><div id="clip-root"><div id="overlay"></div></div></div>
