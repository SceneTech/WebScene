<!doctype html>
<meta charset="utf-8">
<title>Attribute invalidation distinguishes subject and descendant selectors</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  section { padding-left:3px; }
  [data-viewport-state="compact"] { padding-left:41px; }
  [data-container-state="compact"] .attribute-child { height:29px; }
  [data-container-state="compact"] > .direct-child { width:31px; }
  [data-sibling-state="compact"] + .adjacent-target { width:23px; }
  [data-sibling-state="compact"] ~ .general-target { width:27px; }
  .pseudo-not-subject { width:11px; }
  .pseudo-not-subject:not([data-suppressed]) { width:43px; }
  [data-variable-state="compact"] { --consumer-height:37px; }
  .attribute-child { height:11px; }
  .variable-consumer { height:var(--consumer-height, 13px); }
  .has-card { width:13px; }
  .has-card:has([data-image-status="loaded"]) { width:47px; }
  .has-stage .has-target { height:17px; width:19px; }
  .has-stage:has([data-preview-ready]) .has-target { width:59px; }
  .has-stage:has([data-preview-ready]) [aria-hidden="true"] { height:53px; }
</style>
<section id="attribute-subject"><div></div></section>
<section id="attribute-container"><div class="attribute-child direct-child"></div></section>
<section><div id="sibling-trigger"></div><div class="adjacent-target"></div><div class="general-target"></div></section>
<div id="pseudo-not-subject" class="pseudo-not-subject"></div>
<section id="variable-container"><div class="variable-consumer"></div></section>
<section id="has-card" class="has-card"><img id="has-image"></section>
<section id="has-stage" class="has-stage">
  <span id="has-ready"></span><span id="has-target" class="has-target"></span>
</section>
<script>
  test(() => {
    const subject = document.getElementById("attribute-subject");
    subject.setAttribute("data-viewport-state", "compact");
    assert_equals(getComputedStyle(subject).paddingLeft, "41px",
      "a rightmost attribute selector updates its subject");
  }, "rightmost attribute selector invalidates its subject");

  test(() => {
    const container = document.getElementById("attribute-container");
    const child = container.firstElementChild;
    container.setAttribute("data-container-state", "compact");
    assert_equals(getComputedStyle(child).height, "29px",
      "an ancestor attribute selector updates its descendant");
    container.removeAttribute("data-container-state");
    assert_equals(getComputedStyle(child).height, "11px",
      "removing the ancestor attribute restores descendant style");
  }, "ancestor attribute selector invalidates affected descendants");

  test(() => {
    const container = document.getElementById("attribute-container");
    const child = container.firstElementChild;
    container.setAttribute("data-container-state", "compact");
    assert_equals(getComputedStyle(child).width, "31px",
      "a child combinator follows only direct children");
  }, "attribute invalidation follows child combinators");

  test(() => {
    const trigger = document.getElementById("sibling-trigger");
    trigger.setAttribute("data-sibling-state", "compact");
    assert_equals(getComputedStyle(document.querySelector(".adjacent-target")).width, "23px",
      "an adjacent sibling is invalidated");
    assert_equals(getComputedStyle(document.querySelector(".general-target")).width, "27px",
      "a following sibling is invalidated");
  }, "attribute invalidation follows sibling combinators");

  test(() => {
    const subject = document.getElementById("pseudo-not-subject");
    assert_equals(getComputedStyle(subject).width, "43px");
    subject.setAttribute("data-suppressed", "");
    assert_equals(getComputedStyle(subject).width, "11px",
      "an attribute nested in :not() invalidates its subject");
    subject.removeAttribute("data-suppressed");
    assert_equals(getComputedStyle(subject).width, "43px",
      "removing a nested pseudo-class attribute restores style");
  }, "attribute invalidation tracks selector features nested in pseudo classes");

  test(() => {
    const container = document.getElementById("variable-container");
    const consumer = container.firstElementChild;
    container.setAttribute("data-variable-state", "compact");
    assert_equals(getComputedStyle(consumer).height, "37px",
      "an inherited custom property reaches a consumer whose selector does not mention the attribute");
  }, "attribute invalidation follows inherited custom-property consumers");

  test(() => {
    const container = document.getElementById("attribute-container");
    const child = container.firstElementChild;
    for (let index = 0; index < 100; ++index) {
      container.setAttribute(
        "data-container-state", index % 2 ? "compact" : "wide");
    }
    assert_equals(getComputedStyle(child).height, "29px",
      "a synchronous style read observes the last state before its checkpoint");
    for (let index = 0; index < 100; ++index) {
      container.setAttribute(
        "data-container-state", index % 2 ? "wide" : "compact");
    }
    assert_equals(getComputedStyle(child).height, "11px",
      "the following checkpoint observes the final attribute state");
  }, "repeated attribute transitions preserve rendering-checkpoint semantics");

  test(() => {
    const card = document.getElementById("has-card");
    const image = document.getElementById("has-image");
    assert_false(card.matches(':has([data-image-status="loaded"])'));
    image.setAttribute("data-image-status", "loaded");
    assert_true(card.matches(':has([data-image-status="loaded"])'));
    assert_equals(getComputedStyle(card).width, "47px",
      "a descendant attribute invalidates an ancestor selected by :has()");
    image.removeAttribute("data-image-status");
    assert_equals(getComputedStyle(card).width, "13px");
    image.setAttribute("data-image-status", "loaded");
    assert_equals(getComputedStyle(card).width, "47px");
  }, ":has() attribute invalidation targets affected ancestors");

  test(() => {
    const ready = document.getElementById("has-ready");
    const target = document.getElementById("has-target");
    ready.setAttribute("data-preview-ready", "");
    assert_equals(getComputedStyle(target).width, "59px",
      "a changed :has() result invalidates selector subjects after it");
    ready.removeAttribute("data-preview-ready");
    assert_equals(getComputedStyle(target).width, "19px");
    ready.setAttribute("data-preview-ready", "");
    assert_equals(getComputedStyle(target).width, "59px");
    target.setAttribute("aria-hidden", "true");
    assert_equals(getComputedStyle(target).height, "53px",
      "an attribute outside :has() invalidates its subject directly");
    target.removeAttribute("aria-hidden");
    assert_equals(getComputedStyle(target).height, "17px");
    ready.removeAttribute("data-preview-ready");
    assert_equals(getComputedStyle(target).width, "19px");
  }, ":has() invalidation follows relational and direct attribute dependencies");
</script>
