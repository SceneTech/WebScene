<!doctype html>
<meta charset="utf-8">
<title>Child-list changes invalidate structural and relational selector subjects</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
.tree-item {display:block;width:11px;height:13px;padding-left:0px}
.tree-item:first-child {width:41px}
.tree-item:last-child {height:43px}
.tree-item:nth-child(2) {padding-left:17px}
.tree-empty-indicator {height:19px}
.tree-list:empty + .tree-empty-indicator {height:47px}
.tree-has-indicator {width:23px}
.tree-outer:has(.tree-marker) + .tree-has-indicator {width:59px}
.tree-outer:has(.tree-marker) {--tree-size:61px}
.tree-consumer {width:var(--tree-size, 29px)}
.tree-nested:is(.tree-branch:not(:first-child) > .tree-nested) {width:71px}
.tree-nested {width:17px}
.tree-disabled:disabled {width:73px}
.tree-disabled {width:19px}
</style>
<body>
<script>
function fixture(t) {
  const stage = document.createElement('div');
  stage.innerHTML = '<div class="tree-outer"><div class="tree-list"><div class="tree-item tree-marker"></div><div class="tree-item"></div><div class="tree-item"></div></div><div class="tree-empty-indicator"></div><div class="tree-consumer"></div></div><div class="tree-has-indicator"></div>';
  document.body.appendChild(stage);
  t.add_cleanup(() => stage.remove());
  const list = stage.querySelector('.tree-list');
  return {stage, list, items:Array.from(list.children),
    empty:stage.querySelector('.tree-empty-indicator'),
    has:stage.querySelector('.tree-has-indicator'), consumer:stage.querySelector('.tree-consumer')};
}
function verify(f, markerPresent) {
  const items = Array.from(f.list.children);
  items.forEach((node, i) => {
    const style = getComputedStyle(node);
    assert_equals(style.width, i === 0 ? '41px' : '11px', 'first-child ' + i);
    assert_equals(style.height, i === items.length - 1 ? '43px' : '13px', 'last-child ' + i);
    assert_equals(style.paddingLeft, i === 1 ? '17px' : '0px', 'nth-child ' + i);
  });
  assert_equals(getComputedStyle(f.empty).height, items.length === 0 ? '47px' : '19px', ':empty sibling');
  assert_equals(getComputedStyle(f.has).width, markerPresent ? '59px' : '23px', ':has ancestor sibling');
  assert_equals(getComputedStyle(f.consumer).width, markerPresent ? '61px' : '29px', ':has custom-property consumer');
}
for (const [name, mutate] of [
  ['removeChild', f => f.list.removeChild(f.items[0])],
  ['remove', f => f.items[0].remove()],
  ['replaceChild', f => {const n=document.createElement('div');n.className='tree-item';f.list.replaceChild(n,f.items[0]);}],
  ['replaceWith', f => {const n=document.createElement('div');n.className='tree-item';f.items[0].replaceWith(n);}],
  ['replaceChildren', f => f.list.replaceChildren(f.items[1],f.items[2])],
  ['innerHTML', f => {f.list.innerHTML='<div class="tree-item"></div>';}],
  ['textContent', f => {f.list.textContent='';}]
]) test(t => {
  const f = fixture(t);
  verify(f, true);
  mutate(f);
  verify(f, false);
}, name + ' updates positional, relational, sibling and inherited-variable subjects');

for (const [name, mutate] of [
  ['appendChild', f => f.list.appendChild(f.items[0])],
  ['append', f => f.list.append(f.items[0])],
  ['prepend', f => f.list.prepend(f.items[2])],
  ['insertBefore', f => f.list.insertBefore(f.items[2],f.items[0])],
  ['before', f => f.items[0].before(f.items[2])],
  ['after', f => f.items[2].after(f.items[0])],
  ['insertAdjacentElement', f => f.items[2].insertAdjacentElement('afterend',f.items[0])],
  ['insertAdjacentHTML', f => f.list.insertAdjacentHTML('afterbegin','<div class="tree-item"></div>')],
  ['fragment append', f => {const fragment=document.createDocumentFragment();const n=document.createElement('div');n.className='tree-item';fragment.appendChild(n);f.list.appendChild(fragment);}],
  ['fragment insertBefore', f => {const fragment=document.createDocumentFragment();for(let i=0;i<2;i++){const n=document.createElement('div');n.className='tree-item';fragment.appendChild(n);}f.list.insertBefore(fragment,f.items[0]);}]
]) test(t => {
  const f = fixture(t);
  verify(f, true);
  mutate(f);
  verify(f, true);
}, name + ' updates existing siblings against the final child list');

test(t => {
  const from = fixture(t), to = fixture(t);
  to.list.replaceChildren();
  verify(from,true); verify(to,false);
  to.list.appendChild(from.items[0]);
  verify(from,false); verify(to,true);
}, 'reparenting invalidates source and destination relational ancestors');

test(t => {
  const f = fixture(t);
  f.list.replaceChildren();
  f.list.appendChild(document.createComment('not content'));
  assert_equals(getComputedStyle(f.empty).height,'47px');
  f.list.appendChild(document.createTextNode('x'));
  assert_equals(getComputedStyle(f.empty).height,'19px');
  f.list.lastChild.textContent='';
  assert_equals(getComputedStyle(f.empty).height,'47px');
}, ':empty invalidation follows character data but ignores comments and empty text');

for (const [name, insert] of [
  ['append', (list,node) => list.append(node)],
  ['prepend', (list,node) => list.prepend(node)],
  ['insertBefore', (list,node) => list.insertBefore(node,list.firstChild)],
  ['before', (list,node) => list.firstChild.before(node)],
  ['after', (list,node) => list.lastChild.after(node)],
  ['insertAdjacentElement', (list,node) => list.insertAdjacentElement('afterbegin',node)],
  ['replaceChild', (list,node) => list.replaceChild(node,list.firstChild)],
  ['replaceWith', (list,node) => list.firstChild.replaceWith(node)],
  ['replaceChildren', (list,node) => list.replaceChildren(node)]
]) test(t => {
  const from=fixture(t), to=fixture(t);
  to.items[0].className='tree-item';
  verify(from,true); verify(to,false);
  insert(to.list,from.items[0]);
  verify(from,false); verify(to,true);
}, name + ' invalidates both source and destination after reparenting');

for (const property of ['textContent','nodeValue','data']) test(t => {
  const f=fixture(t); f.list.replaceChildren();
  const text=document.createTextNode(''); f.list.appendChild(text);
  assert_equals(getComputedStyle(f.empty).height,'47px');
  text[property]=' ';
  assert_equals(getComputedStyle(f.empty).height,'19px','whitespace prevents :empty');
  text[property]='';
  assert_equals(getComputedStyle(f.empty).height,'47px','empty text does not prevent :empty');
}, property + ' updates empty-state sibling styles');

let connectionObserver=null;
customElements.define('tree-checkpoint', class extends HTMLElement {
  connectedCallback() { if(connectionObserver) connectionObserver(this); }
});
for (const operation of ['appendChild','insertBefore','replaceChild','replaceWith','replaceChildren','innerHTML','insertAdjacentHTML']) test(t => {
  const f=fixture(t); const fragment=document.createDocumentFragment();
  for(let i=0;i<2;i++) {const n=document.createElement('tree-checkpoint');n.className='tree-item';fragment.appendChild(n);}
  const observations=[];
  connectionObserver=() => {
    observations.push({styles:Array.from(f.list.children, n => {
      const s=getComputedStyle(n);return [s.width,s.height,s.paddingLeft];
    }),has:getComputedStyle(f.has).width,consumer:getComputedStyle(f.consumer).width});
  };
  t.add_cleanup(() => {connectionObserver=null;});
  if(operation==='insertBefore') f.list.insertBefore(fragment,f.list.firstChild);
  else if(operation==='innerHTML') f.list.innerHTML='<tree-checkpoint class="tree-item"></tree-checkpoint><tree-checkpoint class="tree-item"></tree-checkpoint>';
  else if(operation==='insertAdjacentHTML') f.list.insertAdjacentHTML('afterbegin','<tree-checkpoint class="tree-item"></tree-checkpoint><tree-checkpoint class="tree-item"></tree-checkpoint>');
  else if(operation==='replaceChild') f.list.replaceChild(fragment,f.list.firstChild);
  else if(operation==='replaceWith') f.list.firstChild.replaceWith(fragment);
  else f.list[operation](fragment);
  connectionObserver=null;
  assert_equals(observations.length,2,'both connection callbacks ran');
  const markerPresent=operation==='appendChild' || operation==='insertBefore' || operation==='insertAdjacentHTML';
  for(const observation of observations) {
    assert_equals(observation.styles.length,f.list.children.length,'final list visible');
    observation.styles.forEach((s,i) => assert_array_equals(s,[i===0?'41px':'11px',
      i===observation.styles.length-1?'43px':'13px',i===1?'17px':'0px']));
    assert_equals(observation.has,markerPresent?'59px':'23px',':has sibling visible in callback');
    assert_equals(observation.consumer,markerPresent?'61px':'29px','inherited variable visible in callback');
  }
}, operation + ' fragment callbacks observe the complete child list and computed styles');

test(t => {
  const stage=document.createElement('div');
  stage.innerHTML='<div></div><div class="tree-branch"><div class="tree-nested"></div></div>';
  document.body.appendChild(stage);t.add_cleanup(() => stage.remove());
  const target=stage.querySelector('.tree-nested');
  assert_equals(getComputedStyle(target).width,'71px');
  stage.firstChild.remove();
  assert_equals(getComputedStyle(target).width,'17px');
  stage.insertBefore(document.createElement('div'),stage.firstChild);
  assert_equals(getComputedStyle(target).width,'71px');
}, 'nested negated structural selectors route from changed siblings to descendants');

test(t => {
  const stage=document.createElement('fieldset');stage.disabled=true;
  stage.innerHTML='<legend><input class="tree-disabled"></legend><legend><input class="tree-disabled"></legend>';
  document.body.appendChild(stage);t.add_cleanup(() => stage.remove());
  const first=stage.firstChild, second=stage.lastChild.firstChild;
  assert_equals(getComputedStyle(second).width,'73px');
  first.remove();
  assert_equals(getComputedStyle(second).width,'19px');
  stage.insertBefore(first,stage.firstChild);
  assert_equals(getComputedStyle(second).width,'73px');
}, 'changing the first legend invalidates inherited disabled state');
</script>
