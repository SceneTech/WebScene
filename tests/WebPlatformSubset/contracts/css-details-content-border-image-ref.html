<!doctype html>
<meta charset="utf-8">
<title>Details content vertical border-image cutoff reference</title>
<style>
  html, body { margin: 0; background: white; }
  .wrapper { width: 116px; margin-left: 4px; position: relative; padding-left: 10px; box-sizing: border-box; }
  .wrapper::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 2px;
    background: linear-gradient(
      to bottom,
      #2468ac 0 calc(100% - 8px),
      transparent calc(100% - 8px));
  }
  .content { height: 40px; background: #eee; }
</style>
<div class="wrapper"><div class="content"></div></div>
