<!doctype html>
<meta charset="utf-8">
<title>Compound foreground filter keyframe midpoint paints in authored order</title>
<link rel="match" href="css-filter-keyframes-midpoint-ref.html">
<style>
  html, body { margin: 0; background: white; }
  #target {
    margin: 24px;
    width: 160px;
    height: 96px;
    background:
      linear-gradient(90deg, #ef3040 0 25%, #30b060 25% 50%,
        #3060ef 50% 75%, #f0c030 75%);
    animation: compound-filter-midpoint 100000s linear -50000s;
  }
  @keyframes compound-filter-midpoint {
    from { filter: grayscale(1) blur(2px) saturate(1.2) brightness(.8); }
    to { filter: grayscale(0) blur(6px) saturate(2) brightness(1.2); }
  }
</style>
<div id="target"></div>
