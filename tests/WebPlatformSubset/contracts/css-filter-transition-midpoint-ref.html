<!doctype html>
<meta charset="utf-8">
<title>Compound filter transition midpoint reference</title>
<style>
  html, body { margin: 0; background: white; }
  #target {
    margin: 24px;
    width: 160px;
    height: 96px;
    background:
      linear-gradient(90deg, #ef3040 0 25%, #30b060 25% 50%,
        #3060ef 50% 75%, #f0c030 75%);
    filter: grayscale(.5) blur(4px) saturate(1.6) contrast(1) brightness(1);
  }
</style>
<div id="target"></div>
