<!doctype html>
<meta charset="utf-8">
<title>Fractional and automatic grid tracks arrange ordinary form rows</title>
<style>
  body { margin: 0; font: 16px/20px Arial, sans-serif; }
  .temperature {
    display: grid;
    width: 500px;
    grid-template-columns: 1fr auto 1fr;
    column-gap: 12px;
  }
  .temperature > * { height: 39px; }
  .equals { width: 12px; }
  .crud {
    display: grid;
    width: 500px;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: 18px;
  }
  .crud > * { height: 80px; }
  .placed {
    display: grid;
    width: 200px;
    grid-template-columns: 60px 140px;
    grid-template-rows: 20px 20px;
  }
  #placed-a { grid-row: 1 / 3; }
  #placed-c { grid-column: 2; }
  .carousel { display:grid; grid-auto-flow:column; grid-template-rows:repeat(1,auto); gap:12px; width:444px; }
  .carousel > * { width:140px; height:80px; }
  .carousel > :first-child .action { opacity:0; }
  .carousel > :first-child.hovered .action { opacity:1; }
  .shell { display:grid; width:500px; height:300px;
    grid-template:"banner banner sidebar" "nav nav nav" "library main aside" 1fr "player player player" / 100px 1fr; }
  #shell-banner { grid-area:banner; height:10px; }
  #shell-nav { grid-area:nav; height:20px; }
  #shell-library { grid-area:library; }
  #shell-main { grid-area:main; }
  #shell-aside { grid-area:aside; width:30px; }
  #shell-player { grid-area:player; height:30px; }
  .spanning-shell { --panel-gap:8px; display:grid; width:300px; height:300px;
    gap:var(--panel-gap);
    grid-template:"top top""nav nav""content aside" 1fr"footer footer"/1fr 1fr; }
  #spanning-header { grid-area:top/1/nav/-1;
    height:calc(48px + var(--panel-gap) * 2); }
  #spanning-banner { grid-area:top; height:0; }
  #spanning-content { grid-area:content; }
  #spanning-aside { grid-area:aside; }
  #spanning-footer { grid-area:footer; height:30px; }
</style>
<div class="temperature" id="temperature">
  <label id="celsius"></label><span class="equals" id="equals">=</span><label id="fahrenheit"></label>
</div>
<div class="crud" id="crud"><div id="list"></div><div id="form"></div></div>
<div class="placed"><div id="placed-a"></div><div id="placed-b"></div><div id="placed-c"></div></div>
<div class="carousel"><div id="carousel-a"><span class="action"></span></div><div id="carousel-b"></div><div id="carousel-c"></div></div>
<div class="shell" id="shell"><div id="shell-banner"></div><div id="shell-nav"></div><div id="shell-library"></div><div id="shell-main"></div><div id="shell-aside"></div><div id="shell-player"></div></div>
<div class="spanning-shell" id="spanning-shell"><div id="spanning-banner"></div><div id="spanning-header"></div><div id="spanning-content"></div><div id="spanning-aside"></div><div id="spanning-footer"></div></div>
<script>
  const state = window.__webSceneWptState = {
    complete: false, harness: null, results: [], errors: [], diagnostics: []
  };
  const rect = id => document.getElementById(id).getBoundingClientRect();
  const close = (actual, expected) => Math.abs(actual - expected) <= .01;
  const require = (value, message) => { if (!value) throw new Error(message); };
  const check = (name, assertion) => {
    const result = { name };
    try { assertion(); result.status = "PASS"; result.message = null; result.stack = null; }
    catch (error) { result.status = "FAIL"; result.message = String(error.message || error); result.stack = error.stack || null; }
    state.results.push(result);
  };

  check("one automatic middle track leaves equal fractional form tracks", () => {
    const left = rect("celsius"), middle = rect("equals"), right = rect("fahrenheit");
    require(close(left.width, 232) && close(middle.width, 12) && close(right.width, 232),
      JSON.stringify({ left, middle, right }));
    require(close(middle.left - left.right, 12) && close(right.left - middle.right, 12),
      "grid gaps or source-order placement changed");
  });

  check("minmax fractional CRUD columns share the available width", () => {
    const list = rect("list"), form = rect("form");
    require(close(list.width, 241) && close(form.width, 241), JSON.stringify({ list, form }));
    require(close(form.left - list.right, 18), "CRUD gap=" + (form.left - list.right));
  });

  check("explicit row spans and column placement retain the authored cells", () => {
    const a = rect("placed-a"), b = rect("placed-b"), c = rect("placed-c");
    require(close(a.width, 60) && close(a.height, 40), JSON.stringify(a));
    require(close(b.left, 60) && close(b.top, 119), JSON.stringify(b));
    require(close(c.left, 60) && close(c.top, 139), JSON.stringify(c));
  });

  check("column auto-flow uses implicit auto columns when grid-auto-columns is omitted", () => {
    const a = rect("carousel-a"), b = rect("carousel-b"), c = rect("carousel-c");
    require(close(a.top, b.top) && close(a.top, c.top), JSON.stringify({ a, b, c }));
    require(close(b.left - a.right, 12) && close(c.left - b.right, 12),
      JSON.stringify({ a, b, c }));
  });

  check("visual-state recascade preserves the horizontal catalog row", () => {
    const before = [rect("carousel-a"), rect("carousel-b"), rect("carousel-c")]
      .map(({ x, y, width, height }) => [x, y, width, height]);
    document.getElementById("carousel-a").classList.add("hovered");
    const after = [rect("carousel-a"), rect("carousel-b"), rect("carousel-c")]
      .map(({ x, y, width, height }) => [x, y, width, height]);
    require(JSON.stringify(after) === JSON.stringify(before), JSON.stringify({ before, after }));
    require(getComputedStyle(document.querySelector(".action")).opacity === "1",
      "visual hover proxy did not trigger recascade");
  });

  check("grid-template shorthand places named application-shell areas", () => {
    const shell = rect("shell"), library = rect("shell-library"), main = rect("shell-main"),
      aside = rect("shell-aside"), player = rect("shell-player");
    require(close(library.top, main.top) && close(main.top, aside.top),
      JSON.stringify({ library, main, aside }));
    require(close(library.left, shell.left) && close(main.left, library.right),
      JSON.stringify({ shell, library, main }));
    require(close(aside.right, shell.right) && close(player.bottom, shell.bottom),
      JSON.stringify({ aside, player, shell }));
    require(close(player.left, shell.left) && close(player.width, shell.width),
      JSON.stringify({ player, shell }));
  });

  check("a definite spanning item overlaps an occupied area and grows auto rows", () => {
    const shell = rect("spanning-shell"), header = rect("spanning-header"),
      content = rect("spanning-content"), aside = rect("spanning-aside"),
      footer = rect("spanning-footer");
    require(close(header.top, shell.top) && close(header.height, 64),
      JSON.stringify({ shell, header }));
    require(close(content.top - shell.top, 72) && close(aside.top, content.top),
      JSON.stringify({ shell, header, content, aside }));
    require(header.bottom + 8 <= content.top + .01,
      "spanning header overlaps the content row");
    require(close(footer.bottom, shell.bottom), JSON.stringify({ shell, footer }));
  });

  state.diagnostics = [JSON.stringify({
    celsius: rect("celsius"), equals: rect("equals"), fahrenheit: rect("fahrenheit"),
    list: rect("list"), form: rect("form"),
    placedA: rect("placed-a"), placedB: rect("placed-b"), placedC: rect("placed-c"),
    spanningHeader: rect("spanning-header"), spanningContent: rect("spanning-content")
  })];
  state.harness = { status: state.results.some(result => result.status !== "PASS") ? 1 : 0, message: null, stack: null };
  state.complete = true;
</script>
