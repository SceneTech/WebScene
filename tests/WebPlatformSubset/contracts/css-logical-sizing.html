<!doctype html>
<meta charset="utf-8">
<title>Logical sizes map to the horizontal writing-mode axes</title>
<style>
  #exact { inline-size: 120px; block-size: 70px; }
  #minimum { inline-size: 20px; block-size: 10px;
    min-inline-size: 90px; min-block-size: 60px; }
  #maximum { inline-size: 180px; block-size: 140px;
    max-inline-size: 110px; max-block-size: 80px; }
</style>
<div id="exact"></div>
<div id="minimum"></div>
<div id="maximum"></div>
<script>
  const state = window.__webSceneWptState = {
    complete: false, harness: null, results: [], errors: [], diagnostics: []
  };
  function test(name, body) {
    try {
      body();
      state.results.push({ name, status: "PASS", message: null, stack: null });
    } catch (error) {
      state.results.push({ name, status: "FAIL", message: String(error.message || error), stack: error.stack || null });
    }
  }
  function assertSize(id, width, height) {
    const rect = document.getElementById(id).getBoundingClientRect();
    if (rect.width !== width || rect.height !== height)
      throw new Error(`${id} was ${rect.width}x${rect.height}, expected ${width}x${height}`);
  }
  test("inline-size and block-size map to physical dimensions", () => assertSize("exact", 120, 70));
  test("logical minimum sizes constrain used dimensions", () => assertSize("minimum", 90, 60));
  test("logical maximum sizes constrain used dimensions", () => assertSize("maximum", 110, 80));
  const failure = state.results.find(result => result.status !== "PASS");
  state.harness = failure
    ? { status: 1, message: failure.message, stack: failure.stack }
    : { status: 0, message: null, stack: null };
  state.complete = true;
</script>
