<!doctype html>
<meta charset="utf-8">
<title>Observed component media queries select the expected rules</title>
<style>
  #probe { --base: pass; }
  @media all { #probe { --media-all: pass; } }
  @media (min-width: 1px) { #probe { --min-width: pass; } }
  @media (max-width: 10000px) { #probe { --max-width: pass; } }
  @media (min-height: 1px) { #probe { --min-height: pass; } }
  @media (max-height: 10000px) { #probe { --max-height: pass; } }
  @media (width>=1px) { #probe { --range-min-width: pass; } }
  @media (width<10000px) { #probe { --range-max-width: pass; } }
  @media (height>1px) { #probe { --range-min-height: pass; } }
  @media (height<=10000px) { #probe { --range-max-height: pass; } }
  @media (orientation: landscape) { #probe { --orientation: pass; } }
  @media (hover: hover) { #probe { --hover: pass; } }
  @media (any-hover: hover) { #probe { --any-hover: pass; } }
  @media (pointer: fine) { #probe { --pointer: pass; } }
  @media (any-pointer: fine) { #probe { --any-pointer: pass; } }
  @media (prefers-reduced-motion: no-preference) {
    #probe { --reduced-motion: pass; }
  }
  @media (prefers-color-scheme: light) {
    #probe { --color-scheme: light; }
  }
  @media (prefers-color-scheme: dark) {
    #probe { --color-scheme: dark; }
  }
</style>
<body>
<div id="probe"></div>
<script>
  const state = window.__webSceneWptState = {
    complete: false,
    harness: null,
    results: [],
    errors: [],
    diagnostics: []
  };

  function test(name, callback) {
    try {
      callback();
      state.results.push({ name, status: "PASS", message: null, stack: null });
    } catch (error) {
      state.results.push({
        name,
        status: "FAIL",
        message: String(error && error.message || error),
        stack: error && error.stack ? String(error.stack) : null
      });
    }
  }

  function assertSelected(style, property) {
    const actual = style.getPropertyValue(property).trim();
    if (actual !== "pass") {
      throw new Error(property + " did not select its rule; got " + JSON.stringify(actual));
    }
  }

  const layeredReset = document.createElement("style");
  layeredReset.textContent = "@layer reset { * { box-sizing: border-box; } }";
  document.head.appendChild(layeredReset);
  const style = getComputedStyle(document.getElementById("probe"));
  test("dynamically inserted universal rules inside a cascade layer recascade existing elements", () => {
    if (style.boxSizing !== "border-box") {
      throw new Error("dynamic layered universal box-sizing resolved to " + style.boxSizing);
    }
  });
  test("dynamically inserted layered universal rules apply to later elements", () => {
    const later = document.createElement("div");
    document.body.appendChild(later);
    if (getComputedStyle(later).boxSizing !== "border-box") {
      throw new Error("later element ignored the dynamic layered universal rule");
    }
  });
  test("media type and viewport bounds", () => {
    for (const property of [
      "--media-all", "--min-width", "--max-width", "--min-height", "--max-height"
    ]) assertSelected(style, property);
  });
  test("orientation query", () => assertSelected(style, "--orientation"));
  test("modern viewport range syntax reaches CSS and matchMedia", () => {
    for (const property of ["--range-min-width", "--range-max-width",
      "--range-min-height", "--range-max-height"]) assertSelected(style, property);
    for (const query of ["(width>=1px)", "(width<10000px)",
      "(height>1px)", "(height<=10000px)"]) {
      if (!matchMedia(query).matches) throw new Error(query + " did not match");
    }
  });
  test("hover and pointer capability queries", () => {
    for (const property of ["--hover", "--any-hover", "--pointer", "--any-pointer"])
      assertSelected(style, property);
  });
  test("reduced motion preference query", () => assertSelected(style, "--reduced-motion"));
  test("preferred color scheme reaches CSS and matchMedia", () => {
    const light = matchMedia("(prefers-color-scheme: light)").matches;
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    if (light === dark) {
      throw new Error("exactly one preferred color scheme must match");
    }
    const cssScheme = style.getPropertyValue("--color-scheme").trim();
    const mediaScheme = dark ? "dark" : "light";
    if (cssScheme !== mediaScheme) {
      throw new Error(
        "CSS resolved " + JSON.stringify(cssScheme)
        + " while matchMedia resolved " + JSON.stringify(mediaScheme));
    }
  });

  const failure = state.results.find(result => result.status !== "PASS");
  state.harness = failure
    ? { status: 1, message: failure.message, stack: failure.stack }
    : { status: 0, message: null, stack: null };
  state.complete = true;
</script>
</body>
