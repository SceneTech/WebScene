<!doctype html>
<meta charset="utf-8">
<title>Retained effect syntax and computed values</title>
<link rel="help" href="https://drafts.fxtf.org/filter-effects-1/">
<link rel="help" href="https://drafts.fxtf.org/css-masking-1/">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  #effect {
    width: 120px;
    height: 80px;
    -webkit-mask: linear-gradient(black, transparent) no-repeat 4px 6px / 20px 30px;
    mask: linear-gradient(black, transparent) no-repeat 4px 6px / 20px 30px;
    clip-path: inset(1px 2px 3px 4px);
    filter: brightness(0.5) grayscale(1);
    backdrop-filter: blur(3px);
  }
  #effect.alternate {
    clip-path: circle(25% at 50% 50%);
    filter: contrast(2);
  }
</style>
<div id="initial"></div>
<div id="effect"></div>
<svg width="0" height="0" aria-hidden="true">
  <defs>
    <clipPath id="local-clip" clipPathUnits="objectBoundingBox">
      <rect x="0" y="0" width="0.5" height="1"></rect>
    </clipPath>
  </defs>
</svg>
<script>
  const initial = document.getElementById('initial');
  const effect = document.getElementById('effect');

  test(() => {
    const style = getComputedStyle(initial);
    assert_equals(style.getPropertyValue('mask-image'), 'none');
    assert_equals(style.getPropertyValue('mask-size'), 'auto');
    assert_equals(style.getPropertyValue('mask-position'), '0% 0%');
    assert_equals(style.getPropertyValue('mask-repeat'), 'repeat');
    assert_equals(style.getPropertyValue('mask-composite'), 'add');
    assert_equals(style.getPropertyValue('mask-mode'), 'match-source');
    assert_equals(style.getPropertyValue('clip-path'), 'none');
    assert_equals(style.getPropertyValue('filter'), 'none');
    assert_equals(style.getPropertyValue('backdrop-filter'), 'none');
  }, 'retained effect properties expose browser-shaped initial values');

  test(() => {
    const style = getComputedStyle(effect);
    assert_regexp_match(style.getPropertyValue('mask-image'), /^linear-gradient\(/);
    effect.style.setProperty('mask-image', 'url("AssetCase.svg")');
    assert_true(getComputedStyle(effect).getPropertyValue('mask-image').includes('AssetCase.svg'));
    effect.style.removeProperty('mask-image');
  }, 'mask-image exposes a computed gradient token');

  test(() => {
    const style = getComputedStyle(effect);
    assert_equals(style.getPropertyValue('mask-size'), '20px 30px');
    assert_equals(style.getPropertyValue('mask-position'), '4px 6px');
  }, 'mask geometry longhands expose computed values');

  test(() => {
    const style = getComputedStyle(effect);
    assert_equals(style.getPropertyValue('mask-repeat'), 'no-repeat');
    assert_equals(style.getPropertyValue('mask-composite'), 'add');
  }, 'mask repeat and composite expose computed values');

  test(() => {
    effect.style.setProperty('mask',
      'linear-gradient(black, transparent) no-repeat center / 40px 30px');
    const style = getComputedStyle(effect);
    assert_regexp_match(style.getPropertyValue('mask-image'), /^linear-gradient\(/);
    assert_equals(style.getPropertyValue('mask-position'), 'center');
    assert_equals(style.getPropertyValue('mask-size'), '40px 30px');
    assert_equals(style.getPropertyValue('mask-repeat'), 'no-repeat');
    effect.style.removeProperty('mask');
  }, 'single-layer mask shorthand expands into effective retained longhands');

  test(() => {
    effect.style.setProperty('mask',
      'radial-gradient(circle at center, black, transparent) no-repeat center / 40px 30px, ' +
      'linear-gradient(to right, transparent, black) no-repeat 0% 0% / 100% 100%');
    const style = getComputedStyle(effect);
    assert_true(style.getPropertyValue('mask-image').includes('radial-gradient('));
    assert_true(style.getPropertyValue('mask-image').includes('linear-gradient('));
    assert_equals(style.getPropertyValue('mask-repeat'), 'no-repeat, no-repeat');
    assert_equals(style.getPropertyValue('mask-composite'), 'add, add');
    effect.style.setProperty('mask-composite', 'exclude, add');
    assert_equals(getComputedStyle(effect).getPropertyValue('mask-composite'),
      'exclude, add');
    effect.style.removeProperty('mask');
  }, 'radial and multiple mask shorthand layers expand in authored order');

  test(() => {
    effect.style.setProperty('-webkit-mask-composite', 'xor, xor');
    assert_equals(effect.style.getPropertyValue('mask-composite'), 'xor, xor');
    assert_equals(getComputedStyle(effect).getPropertyValue('mask-composite'),
      'xor, xor');
    effect.style.removeProperty('-webkit-mask-composite');
  }, 'WebKit xor alias preserves CSSOM text and maps to retained exclude');

  test(() => {
    assert_equals(getComputedStyle(effect).getPropertyValue('clip-path'),
      'inset(1px 2px 3px 4px)');
  }, 'clip-path exposes the supported inset syntax');

  test(() => {
    effect.style.setProperty('clip-path', 'ellipse(25% 40% at 60% 30%)');
    assert_equals(getComputedStyle(effect).getPropertyValue('clip-path'),
      'ellipse(25% 40% at 60% 30%)');
    effect.style.removeProperty('clip-path');
  }, 'clip-path preserves explicit ellipse radii and center');

  test(() => {
    const value = 'path(evenodd, "M0 0 H120 V80 H0 Z M20 20 H100 V60 H20 Z")';
    effect.style.setProperty('clip-path', value);
    assert_equals(getComputedStyle(effect).getPropertyValue('clip-path'), value);
    effect.style.removeProperty('clip-path');
  }, 'clip-path preserves a bounded quoted SVG path and fill rule');

  test(() => {
    effect.style.setProperty('clip-path', 'url(#local-clip)');
    assert_equals(getComputedStyle(effect).getPropertyValue('clip-path'),
      'url(#local-clip)');
    effect.style.removeProperty('clip-path');
  }, 'clip-path preserves a same-document SVG fragment reference');

  test(() => {
    assert_equals(getComputedStyle(effect).getPropertyValue('filter'),
      'brightness(0.5) grayscale(1)');
  }, 'foreground filter exposes its computed function list');

  test(() => {
    effect.style.setProperty('filter',
      'blur(2px) saturate(1.08) contrast(1.5) grayscale(0.25)');
    assert_equals(getComputedStyle(effect).getPropertyValue('filter'),
      'blur(2px) saturate(1.08) contrast(1.5) grayscale(0.25)');
    effect.style.removeProperty('filter');
  }, 'compound foreground filters preserve authored function order');

  test(() => {
    effect.style.setProperty('filter', 'blur(max(4px, calc(8px * 0.25)))');
    assert_equals(getComputedStyle(effect).getPropertyValue('filter'),
      'blur(max(4px, calc(8px * 0.25)))');
    effect.style.removeProperty('filter');
  }, 'foreground blur preserves nested functional length syntax');

  test(() => {
    assert_equals(getComputedStyle(effect).getPropertyValue('backdrop-filter'), 'blur(3px)');
  }, 'backdrop filter exposes its computed function list');

  test(() => {
    effect.style.setProperty('filter', 'brightness(0.75)');
    effect.style.setProperty('filter', 'unknown-effect(2)');
    assert_equals(effect.style.getPropertyValue('filter'), 'brightness(0.75)');
    assert_equals(getComputedStyle(effect).getPropertyValue('filter'), 'brightness(0.75)');
    effect.style.removeProperty('filter');
  }, 'invalid effect CSSOM writes preserve the previous declaration');

  test(() => {
    effect.classList.add('alternate');
    assert_equals(getComputedStyle(effect).getPropertyValue('filter'), 'contrast(2)');
    assert_equals(getComputedStyle(effect).getPropertyValue('clip-path'),
      'circle(25% at 50% 50%)');
    effect.classList.remove('alternate');
    assert_equals(getComputedStyle(effect).getPropertyValue('filter'),
      'brightness(0.5) grayscale(1)');
  }, 'class mutation refreshes and restores effect computed values');

  test(() => {
    const before = effect.getBoundingClientRect();
    effect.style.setProperty('filter', 'blur(2px)');
    effect.style.setProperty('clip-path', 'inset(2px)');
    const after = effect.getBoundingClientRect();
    assert_equals(getComputedStyle(effect).getPropertyValue('filter'), 'blur(2px)');
    assert_equals(after.width, before.width);
    assert_equals(after.height, before.height);
  }, 'effect syntax does not change principal box geometry');
</script>
