<!doctype html>
<meta charset="utf-8">
<title>CSSOM reads synchronously flush pending style recalculation</title>
<style>
  #target { display: block; color: rgb(255, 0, 0); width: 73px; }
  #target span { color: inherit; }
  #dependency[style] span { color: rgb(0, 128, 0); }
</style>
<div id="target"><span>result</span></div>
<div id="dependency"><span>dependent result</span></div>
<script>
  const state = window.__webSceneWptState = {
    complete: false, harness: null, results: [], errors: [], diagnostics: []
  };

  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  function test(name, body) {
    try {
      body();
      state.results.push({ name, status: "PASS", message: null, stack: null });
    } catch (error) {
      state.results.push({
        name, status: "FAIL",
        message: String(error && error.message || error),
        stack: error && error.stack ? String(error.stack) : null
      });
    }
  }

  const target = document.getElementById("target");

  test("getComputedStyle observes inline declaration removal synchronously", () => {
    target.style.display = "none";
    target.style.removeProperty("display");
    assert(getComputedStyle(target).display === "block",
      `computed display became ${JSON.stringify(getComputedStyle(target).display)}`);
  });

  test("geometry observes the restored stylesheet declaration synchronously", () => {
    target.style.width = "11px";
    target.style.removeProperty("width");
    assert(target.getBoundingClientRect().width === 73,
      `restored width became ${target.getBoundingClientRect().width}`);
  });

  test("inherited style resumes after inline removal in the same task", () => {
    target.style.color = "blue";
    target.style.removeProperty("color");
    const childColor = getComputedStyle(target.firstElementChild).color;
    assert(childColor === "rgb(255, 0, 0)",
      `inherited color became ${JSON.stringify(childColor)}`);
  });

  test("ancestor style-attribute selectors invalidate descendants", () => {
    const dependency = document.getElementById("dependency");
    const child = dependency.firstElementChild;
    dependency.setAttribute("style", "display: block");
    assert(getComputedStyle(child).color === "rgb(0, 128, 0)",
      "descendant did not observe matching ancestor style attribute");
    dependency.removeAttribute("style");
    assert(getComputedStyle(child).color !== "rgb(0, 128, 0)",
      "descendant retained a selector whose ancestor style attribute stopped matching");
  });

  test("stylesheet replacement reclassifies ordinary and pseudo-element rules", () => {
    const sheet = document.createElement("style");
    document.head.appendChild(sheet);
    const pseudo = document.createElement("div");
    pseudo.className = "classification-probe";
    document.body.appendChild(pseudo);
    try {
      for (let iteration = 0; iteration < 3; ++iteration) {
        // Inspect generated geometry, not getComputedStyle's pseudo argument
        // (that separate CSSOM API is not yet supported by WebScene).
        sheet.textContent = ".classification-probe { display: flex; width: 200px; } .classification-probe::before { content: ''; width: 10px; height: 61px; }";
        assert(pseudo.getBoundingClientRect().height === 61, "before rule did not generate its box");
        sheet.textContent = ".classification-probe { display: flex; width: 131px; } .classification-probe:after { content: ''; width: 10px; height: 23px; }";
        assert(pseudo.getBoundingClientRect().width === 131, "ordinary replacement not classified");
        assert(pseudo.getBoundingClientRect().height === 23, "after box missing or removed taller before box survived replacement");
      }
    } finally {
      sheet.remove();
      pseudo.remove();
    }
  });

  test("generated text keeps its own box after stylesheet replacement", () => {
    const sheet = document.createElement("style");
    const probe = document.createElement("div");
    probe.className = "generated-metrics";
    document.head.appendChild(sheet);
    document.body.appendChild(probe);
    try {
      for (const size of [40, 20, 40]) {
        sheet.textContent = ".generated-metrics { display:flex; width:100px; } .generated-metrics:before { content:'x'; width:20px; height:" + size + "px; }";
        assert(probe.getBoundingClientRect().height === size,
          "pseudo text did not generate its " + size + "px box");
      }
    } finally {
      sheet.remove();
      probe.remove();
    }
  });

  test("matched-rule ordering preserves specificity, source order and important priority", () => {
    const sheet = document.createElement("style");
    const probe = document.createElement("div");
    probe.id = "matched-order";
    probe.className = "order-probe order-probe";
    probe.setAttribute("data-order", "yes");
    document.head.appendChild(sheet);
    document.body.appendChild(probe);
    try {
      for (const widths of [[73, 79], [79, 73], [73, 79]]) {
        sheet.textContent = "#matched-order { width:" + widths[0] + "px; display:flex; }"
          + "#matched-order::before {content:''; width:10px; height:47px;}"
          + ".order-probe {width:17px;} [data-order] {width:19px;}"
          + ".order-probe::before {content:''; height:13px;}"
          + "#matched-order {width:" + widths[1] + "px;}"
          + "#matched-order.special {width:91px;}"
          + ".order-probe.priority {width:61px!important;}"
          + "@media(min-width:99999px){#matched-order{width:999px;} #matched-order::before{height:999px;}}";
        assert(probe.getBoundingClientRect().width === widths[1], "source order or specificity changed");
        assert(probe.getBoundingClientRect().height === 47, "pseudo specificity or media filtering changed");
        probe.className = "order-probe special";
        assert(probe.getBoundingClientRect().width === 91, "more specific state rule lost");
        probe.className = "order-probe priority";
        assert(probe.getBoundingClientRect().width === 61, "important declaration lost to specificity");
        probe.className = "order-probe order-probe";
        assert(probe.getBoundingClientRect().width === widths[1], "state removal retained a stale match");
      }
    } finally {
      sheet.remove();
      probe.remove();
    }
  });

  state.diagnostics.push(JSON.stringify({
    display: getComputedStyle(target).display,
    width: target.getBoundingClientRect().width,
    color: getComputedStyle(target.firstElementChild).color
  }));
  const failure = state.results.find(result => result.status !== "PASS");
  state.harness = failure
    ? { status: 1, message: failure.message, stack: failure.stack }
    : { status: 0, message: null, stack: null };
  state.complete = true;
</script>
