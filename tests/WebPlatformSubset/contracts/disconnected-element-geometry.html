<!doctype html>
<meta charset="utf-8">
<title>Disconnected element geometry</title>
<body>
<script>
  const state = window.__webSceneWptState = {
    complete: false, harness: null, results: [], errors: [], diagnostics: []
  };

  function record(name, condition, detail) {
    const error = condition ? null : new Error(detail);
    state.results.push({
      name,
      status: error ? "FAIL" : "PASS",
      message: error ? error.message : null,
      stack: error ? error.stack : null
    });
  }

  const element = document.createElement("div");
  element.style.cssText = "width:40px;height:30px";
  const rect = element.getBoundingClientRect();
  const rects = element.getClientRects();
  record(
    "a disconnected element has no client rectangles",
    element.isConnected === false && rects.length === 0,
    `connected=${element.isConnected}, rects=${rects.length}`
  );
  record(
    "a disconnected element has a zero bounding rectangle",
    rect.x === 0 && rect.y === 0 && rect.width === 0 && rect.height === 0
      && rect.right === 0 && rect.bottom === 0,
    `rect=${JSON.stringify(rect)}`
  );

  const root = document.createElement("section");
  let deepest = root;
  for (let depth = 0; depth < 32; ++depth) {
    const child = document.createElement("div");
    deepest.appendChild(child);
    deepest = child;
  }
  deepest.style.cssText = "display:block;width:41px;height:31px";
  document.body.appendChild(root);
  const connectedRect = deepest.getBoundingClientRect();
  record(
    "deep connected element geometry survives a single root walk",
    deepest.isConnected === true
      && connectedRect.width === 41
      && connectedRect.height === 31,
    `connected=${deepest.isConnected}, rect=${JSON.stringify(connectedRect)}`
  );

  root.remove();
  const removedRect = deepest.getBoundingClientRect();
  record(
    "deep element geometry becomes empty after its root is detached",
    deepest.isConnected === false
      && deepest.getClientRects().length === 0
      && removedRect.width === 0
      && removedRect.height === 0,
    `connected=${deepest.isConnected}, rect=${JSON.stringify(removedRect)}`
  );

  document.body.appendChild(root);
  const reconnectedRect = deepest.getBoundingClientRect();
  record(
    "deep element geometry is restored when its root is reattached",
    deepest.isConnected === true
      && reconnectedRect.width === 41
      && reconnectedRect.height === 31,
    `connected=${deepest.isConnected}, rect=${JSON.stringify(reconnectedRect)}`
  );

  state.diagnostics = [JSON.stringify({
    rects: rects.length,
    rect,
    connectedRect,
    removedRect,
    reconnectedRect
  })];
  const failure = state.results.find(result => result.status !== "PASS");
  state.harness = failure
    ? { status: 1, message: failure.message, stack: failure.stack }
    : { status: 0, message: null, stack: null };
  state.complete = true;
</script>
</body>
