<!doctype html>
<meta charset="utf-8">
<title>DocumentFragment appendChild applies structural selectors atomically</title>
<link rel="help" href="https://dom.spec.whatwg.org/#concept-node-insert">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  #host:empty { height: 1px; }
  #host:has(.item) { min-height: 2px; }
  #host > .item:first-child { width: 3px; }
  #host > .item:nth-child(2) { width: 4px; }
  #host > .item:last-child { width: 5px; }
</style>
<section id="host"></section>
<script>
test(() => {
  const fragment = document.createDocumentFragment();
  for (let index = 0; index < 3; ++index) {
    const item = document.createElement('div');
    item.className = 'item';
    fragment.appendChild(item);
  }
  const returned = host.appendChild(fragment);
  assert_equals(returned, fragment);
  assert_equals(fragment.childNodes.length, 0);
  assert_equals(host.children.length, 3);
  assert_array_equals(
    Array.from(host.children, item => getComputedStyle(item).width),
    ['3px', '4px', '5px']);
  assert_equals(getComputedStyle(host).minHeight, '2px');
  assert_not_equals(getComputedStyle(host).height, '1px');
}, 'appendChild transfers a fragment before structural selector matching');
</script>
