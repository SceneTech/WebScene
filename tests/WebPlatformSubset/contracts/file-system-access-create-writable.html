<!doctype html>
<meta charset="utf-8">
<title>File System Access createWritable browser oracle</title>
<!-- Cases follow WPT fs/script-tests/FileSystemWritableFileStream.js,
     FileSystemWritableFileStream-write.js and
     FileSystemWritableFileStream-piped.js at revision
     2c705104a295c48053eeddf7fe0170d790a4e853. -->
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
  const withFile = (label, initial, body) => promise_test(async t => {
    assert_true(Boolean(navigator.storage && navigator.storage.getDirectory),
      "origin-private file system is unavailable");
    const root = await navigator.storage.getDirectory();
    const fixture = `webscene-writer-${Date.now()}-${Math.random()}`;
    const directory = await root.getDirectoryHandle(fixture, {create:true});
    t.add_cleanup(() => root.removeEntry(fixture, {recursive:true}));
    const handle = await directory.getFileHandle("fixture.bin", {create:true});
    if (initial !== undefined) {
      const writer = await handle.createWritable();
      await writer.write(initial);
      await writer.close();
    }
    await body(handle, t);
  }, label);

  withFile("createWritable publishes atomically on close and abort preserves the original",
    "before", async handle => {
      const writer = await handle.createWritable();
      assert_true(writer instanceof FileSystemWritableFileStream);
      assert_true(writer instanceof WritableStream);
      await writer.write("after");
      assert_equals(await (await handle.getFile()).text(), "before");
      await writer.abort();
      assert_equals(await (await handle.getFile()).text(), "before");
      const committed = await handle.createWritable();
      await committed.write("after");
      await committed.close();
      assert_equals(await (await handle.getFile()).text(), "after");
    });

  withFile("write seek and truncate preserve cursor and zero-fill gaps",
    undefined, async handle => {
      const writer = await handle.createWritable();
      await writer.write("abc");
      await writer.seek(5);
      await writer.write(new Uint8Array([255]));
      await writer.truncate(8);
      await writer.close();
      assert_array_equals(new Uint8Array(await (await handle.getFile()).arrayBuffer()),
        [97, 98, 99, 0, 0, 255, 0, 0]);
    });

  withFile("keepExistingData supports positioned Blob and string writes",
    "1234567890", async handle => {
      const writer = await handle.createWritable({keepExistingData:true});
      await writer.write({type:"write", position:4, data:new Blob(["abc"])});
      await writer.seek(9);
      await writer.write("Z");
      await writer.close();
      assert_equals(await (await handle.getFile()).text(), "1234abc89Z");
    });

  withFile("concurrent siloed writers commit complete snapshots in close order",
    "original", async handle => {
      const first = await handle.createWritable();
      const second = await handle.createWritable();
      await first.write("first");
      await second.write("second");
      assert_equals(await (await handle.getFile()).text(), "original");
      await second.close();
      assert_equals(await (await handle.getFile()).text(), "second");
      await first.close();
      assert_equals(await (await handle.getFile()).text(), "first");
    });

  withFile("terminal close is unique and later operations reject TypeError",
    undefined, async (handle, t) => {
      const writer = await handle.createWritable();
      await writer.write(new ArrayBuffer(0));
      const results = await Promise.all(Array.from({length:16},
        () => writer.close().then(() => 1, () => 0)));
      assert_equals(results.reduce((sum, value) => sum + value, 0), 1);
      await promise_rejects_js(t, TypeError, writer.write("late"));
      await promise_rejects_js(t, TypeError, writer.truncate(0));
    });
</script>
</body>
