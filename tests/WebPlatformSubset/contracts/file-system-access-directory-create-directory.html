<!doctype html>
<meta charset="utf-8">
<title>File System Access create directory child browser oracle</title>
<!-- Cases follow WPT fs/script-tests/FileSystemDirectoryHandle-getDirectoryHandle.js
     at revision 2c705104a295c48053eeddf7fe0170d790a4e853. -->
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
  const withDirectory = (label, body) => promise_test(async t => {
    assert_true(Boolean(navigator.storage && navigator.storage.getDirectory),
      "origin-private file system is unavailable");
    const root = await navigator.storage.getDirectory();
    const fixture = `webscene-create-directory-${Date.now()}-${Math.random()}`;
    const directory = await root.getDirectoryHandle(fixture, {create:true});
    t.add_cleanup(() => root.removeEntry(fixture, {recursive:true}));
    await body(directory, t);
  }, label);

  withDirectory("create:true creates a missing empty directory with its requested name",
    async directory => {
      const handle = await directory.getDirectoryHandle("created-🙂", {create:true});
      assert_true(handle instanceof FileSystemDirectoryHandle);
      assert_equals(handle.kind, "directory");
      assert_equals(handle.name, "created-🙂");
      const entries = [];
      for await (const entry of handle.values()) entries.push(entry);
      assert_array_equals(entries, []);
    });

  withDirectory("create:true returns an existing directory without removing children",
    async directory => {
      const original = await directory.getDirectoryHandle("existing", {create:true});
      const fileHandle = await original.getFileHandle("preserved.txt", {create:true});
      const writable = await fileHandle.createWritable();
      await writable.write("preserved");
      await writable.close();
      const reopened = await directory.getDirectoryHandle("existing", {create:true});
      assert_true(await reopened.isSameEntry(original));
      const preserved = await reopened.getFileHandle("preserved.txt");
      assert_equals(await (await preserved.getFile()).text(), "preserved");
    });

  withDirectory("create:true rejects a file collision and unsafe names",
    async (directory, t) => {
      await directory.getFileHandle("collision", {create:true});
      await promise_rejects_dom(t, "TypeMismatchError",
        directory.getDirectoryHandle("collision", {create:true}));
      for (const name of ["", ".", "..", "nested/child", "nested\\child"]) {
        await promise_rejects_js(t, TypeError,
          directory.getDirectoryHandle(name, {create:true}));
      }
    });
</script>
</body>
