<!doctype html>
<meta charset="utf-8">
<title>File System Access removeEntry browser oracle</title>
<!-- Cases follow WPT fs/script-tests/FileSystemDirectoryHandle-removeEntry.js
     at revision 2c705104a295c48053eeddf7fe0170d790a4e853. -->
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
  const withDirectory = (label, body) => promise_test(async t => {
    assert_true(Boolean(navigator.storage && navigator.storage.getDirectory),
      "origin-private file system is unavailable");
    const root = await navigator.storage.getDirectory();
    const fixture = `webscene-remove-${Date.now()}-${Math.random()}`;
    const directory = await root.getDirectoryHandle(fixture, {create:true});
    t.add_cleanup(() => root.removeEntry(fixture, {recursive:true}));
    await body(directory, t);
  }, label);

  withDirectory("removeEntry removes files and empty directories",
    async (directory, t) => {
      await directory.getFileHandle("file.txt", {create:true});
      await directory.getDirectoryHandle("empty", {create:true});
      assert_equals(await directory.removeEntry("file.txt"), undefined);
      assert_equals(await directory.removeEntry("empty"), undefined);
      await promise_rejects_dom(t, "NotFoundError",
        directory.getFileHandle("file.txt"));
      await promise_rejects_dom(t, "NotFoundError",
        directory.getDirectoryHandle("empty"));
    });

  withDirectory("removeEntry rejects a non-empty directory without recursion",
    async (directory, t) => {
      const tree = await directory.getDirectoryHandle("tree", {create:true});
      await tree.getFileHandle("child.txt", {create:true});
      await promise_rejects_dom(t, "InvalidModificationError",
        directory.removeEntry("tree"));
      assert_equals((await directory.getDirectoryHandle("tree")).name, "tree");
    });

  withDirectory("recursive removeEntry removes a nested Unicode tree",
    async (directory, t) => {
      const tree = await directory.getDirectoryHandle("tréé-🙂", {create:true});
      const nested = await tree.getDirectoryHandle("nested", {create:true});
      await nested.getFileHandle("child.bin", {create:true});
      assert_equals(await directory.removeEntry("tréé-🙂", {recursive:true}),
        undefined);
      await promise_rejects_dom(t, "NotFoundError",
        directory.getDirectoryHandle("tréé-🙂"));
    });

  withDirectory("removeEntry reports missing and validates one component",
    async (directory, t) => {
      await promise_rejects_dom(t, "NotFoundError",
        directory.removeEntry("missing"));
      for (const name of ["", ".", "..", "nested/child", "nested\\child"]) {
        await promise_rejects_js(t, TypeError, directory.removeEntry(name));
      }
    });
</script>
</body>
