<!doctype html>
<meta charset="utf-8">
<title>VS Code 645f29c Markdown resource broker fixture</title>
<div id="preview" class="preview">Markdown preview</div>
<img id="markdown-image" alt="deterministic Markdown image">
<script>
  if (!new URL(location.href).searchParams.has('id') && location.protocol === 'file:') {
    const prepared = new URL(location.href);
    prepared.searchParams.set('id', 'markdown-preview');
    history.replaceState(null, '', prepared);
  }
  if (!new URL(location.href).searchParams.has('id')) {
    const next = new URL(location.href);
    next.searchParams.set('id', 'markdown-preview');
    location.replace(next);
  } else {
    const state = window.__webSceneWptState = {
      complete:false, harness:null, results:[], errors:[], diagnostics:[], durations:[], phase:'register'
    };
    let controlReload = false;
    let brokerWorker = null;
    let readmeBody = '';
    const record = (name, condition, detail = 'Contract failed') => state.results.push({
      name, status:condition ? 'PASS' : 'FAIL',
      message:condition ? null : detail, stack:null
    });
    const nativeFixture = location.hostname === 'vscode-webview.test'
      || location.protocol === 'file:';
    const resourceOrigin = nativeFixture
      ? 'https://file+.vscode-resource.test'
      : `http://localhost:${location.port}`;
    const workerParameters = nativeFixture
      ? 'vscode-resource-base-authority=vscode-resource.test&platform=electron'
      : `remoteAuthority=${encodeURIComponent(`localhost:${location.port}`)}&platform=electron`;
    const resourceUrl = name => `${resourceOrigin}/workspace/${name}`;
    const seen = new Map();
    const streamStarts = new Map();
    const responseBytes = new TextEncoder();
    const pngBytes = new Uint8Array([
      137,80,78,71,13,10,26,10,0,0,0,13,73,72,68,82,0,0,0,1,0,0,0,1,
      8,6,0,0,0,31,21,196,137,0,0,0,13,73,68,65,84,120,218,99,144,221,
      25,242,31,0,4,75,2,42,129,235,13,188,0,0,0,0,73,69,78,68,174,66,96,130
    ]);
    const resourceBodies = new Map([
      ['/workspace/prelude.js', {
        mime:'text/javascript', body:'globalThis.__markdownPrelude=(globalThis.__markdownPrelude||0)+1;'
      }],
      ['/workspace/extension.css', {
        mime:'text/css', body:'.preview{color:rgb(12,34,56);width:32px;height:24px;background-image:url("css-image.svg");background-repeat:no-repeat}'
      }],
      ['/workspace/markdown-image.svg', {
        mime:'image/svg+xml', body:'<svg xmlns="http://www.w3.org/2000/svg" width="7" height="5" viewBox="0 0 7 5"><rect width="7" height="5" fill="#0c2238"/></svg>'
      }],
      ['/workspace/markdown-image.png', {
        mime:'image/png', body:pngBytes
      }],
      ['/workspace/css-image.svg', {
        mime:'image/svg+xml', body:'<svg xmlns="http://www.w3.org/2000/svg" width="3" height="2" viewBox="0 0 3 2"><rect width="3" height="2" fill="#0c2238"/></svg>'
      }],
      ['/workspace/stale.svg', {
        mime:'image/svg+xml', body:'<svg xmlns="http://www.w3.org/2000/svg" width="13" height="11" viewBox="0 0 13 11"><rect width="13" height="11" fill="#f00"/></svg>'
      }],
      ['/workspace/markdown/preview.js', {
        mime:'text/javascript', body:'globalThis.__consumerMarkdown=true;'
      }],
      ['/workspace/notebook/renderer.js', {
        mime:'text/javascript', body:'export default "notebook-renderer";'
      }],
      ['/workspace/custom-editor/editor.css', {
        mime:'text/css', body:'.custom-editor{color:rgb(21,22,23)}'
      }],
      ['/workspace/extension-detail/icon.svg', {
        mime:'image/svg+xml', body:'<svg xmlns="http://www.w3.org/2000/svg" width="11" height="9"/>'
      }],
      ['/workspace/chat-mcp/app.js', {
        mime:'text/javascript', body:'export const channel="chat-mcp";'
      }],
      ['/workspace/mermaid/index.js', {
        mime:'text/javascript', body:'export const renderer="mermaid";'
      }],
      ['/workspace/mermaid/codicon.css', {
        mime:'text/css', body:'.codicon{font-family:codicon}'
      }],
      ['/workspace/simple-browser/main.js', {
        mime:'text/javascript', body:'globalThis.__consumerSimpleBrowser=true;'
      }],
      ['/workspace/simple-browser/main.css', {
        mime:'text/css', body:'.simple-browser{display:block}'
      }],
      ['/workspace/release-notes/media.svg', {
        mime:'image/svg+xml', body:'<svg xmlns="http://www.w3.org/2000/svg" width="17" height="13"/>'
      }],
      ['/workspace/warm-64k.bin', {
        mime:'application/octet-stream', body:new Uint8Array(64 * 1024).fill(0x5a),
        etag:'"consumer-matrix-v1"'
      }]
    ]);
    const postStream = (request, mime, body, etag = undefined) => {
      if (etag && request.ifNoneMatch === etag) {
        brokerWorker.postMessage({channel:'did-load-resource', data:{
          status:304, id:request.id, path:request.path, mime, etag
        }});
        return;
      }
      const bytes = body instanceof Uint8Array ? body : responseBytes.encode(body);
      streamStarts.set(request.path, (streamStarts.get(request.path) || 0) + 1);
      brokerWorker.postMessage({channel:'did-load-resource', data:{
        status:200, id:request.id, path:request.path, mime,
        etag, mtime:undefined
      }});
      const split = Math.max(1, Math.floor(bytes.byteLength / 2));
      brokerWorker.postMessage({channel:'did-load-resource-chunk', data:{
        id:request.id, data:bytes.slice(0, split)
      }});
      brokerWorker.postMessage({channel:'did-load-resource-chunk', data:{
        id:request.id, data:bytes.slice(split)
      }});
      brokerWorker.postMessage({channel:'did-load-resource-end', data:{
        id:request.id
      }});
    };
    navigator.serviceWorker.addEventListener('message', event => {
      const request = event.data;
      if (!request || request.channel !== 'load-resource') return;
      seen.set(request.path, (seen.get(request.path) || 0) + 1);
      if (request.path === '/workspace/README.md') {
        postStream(request, 'text/markdown', readmeBody);
        return;
      }
      if (request.path === '/workspace/missing.png') {
        brokerWorker.postMessage({
          channel:'did-load-resource', data:{status:404, id:request.id,
            path:request.path}
        });
        return;
      }
      if (request.path === '/outside/denied.png') {
        brokerWorker.postMessage({
          channel:'did-load-resource', data:{status:401, id:request.id,
            path:request.path}
        });
        return;
      }
      const resource = request.path.startsWith('/workspace/batch/')
        ? {mime:'application/octet-stream', body:new Uint8Array(1024 * 1024).fill(0x42)}
        : resourceBodies.get(request.path);
      if (resource && request.path === '/workspace/stale.svg') {
        setTimeout(() => postStream(request, resource.mime, resource.body), 25);
      } else if (resource) postStream(request, resource.mime, resource.body, resource.etag);
      else brokerWorker.postMessage({
        channel:'did-load-resource', data:{status:404, id:request.id, path:request.path}
      });
    });
    const load = element => new Promise((resolve, reject) => {
      element.onload = resolve;
      element.onerror = () => reject(new Error(`resource failed: ${element.src || element.href}`));
      document.body.append(element);
    });
    const loadImage = (url, expectError = false) => new Promise((resolve, reject) => {
      const image = document.createElement('img');
      image.onload = () => {
        const result = {event:'load', width:image.naturalWidth,
          height:image.naturalHeight};
        image.remove();
        expectError ? reject(new Error(`image unexpectedly loaded ${url}`))
          : resolve(result);
      };
      image.onerror = () => {
        const result = {event:'error', width:image.naturalWidth,
          height:image.naturalHeight};
        image.remove();
        expectError ? resolve(result) : reject(new Error(`image failed ${url}`));
      };
      image.src = url;
      document.body.append(image);
    });
    (async () => {
      const changed = new Promise(resolve => navigator.serviceWorker.addEventListener(
        'controllerchange', resolve, {once:true}));
      const registration = await navigator.serviceWorker.register(
        `service-worker.js?${workerParameters}`);
      state.phase = 'control';
      if (!navigator.serviceWorker.controller && !nativeFixture) {
        await Promise.race([
          changed,
          new Promise(resolve => setTimeout(resolve, 100))
        ]);
      }
      if (!navigator.serviceWorker.controller && !nativeFixture
          && !new URL(location.href).searchParams.has('controlled')) {
        controlReload = true;
        const controlled = new URL(location.href);
        controlled.searchParams.set('controlled', '1');
        location.replace(controlled);
        return;
      }
      if (nativeFixture && !navigator.serviceWorker.controller) {
        await Promise.race([
          changed,
          new Promise(resolve => setTimeout(resolve, 2500))
        ]);
      }
      brokerWorker = navigator.serviceWorker.controller || registration.active;
      if (!brokerWorker) throw new Error('worker did not control fixture');
      if (nativeFixture && !navigator.serviceWorker.controller) {
        throw new Error('worker did not claim native fixture');
      }
      readmeBody = await (await fetch('README.md')).text();
      state.phase = 'script';
      const script = document.createElement('script');
      script.src = resourceUrl('prelude.js');
      await load(script);
      state.phase = 'stylesheet';
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = resourceUrl('extension.css');
      await load(link);
      state.phase = 'element-image';
      const image = document.getElementById('markdown-image');
      image.src = resourceUrl('markdown-image.svg');
      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error('Markdown image failed'));
      });
      const readme = readmeBody;
      state.phase = 'initial-css-image';
      for (let attempt = 0; attempt < 100 && !seen.has('/workspace/css-image.svg'); ++attempt) {
        await new Promise(resolve => setTimeout(resolve, 2));
      }
      record('unchanged VS Code worker streams Markdown preview resources',
        globalThis.__markdownPrelude === 1
          && getComputedStyle(document.getElementById('preview')).color === 'rgb(12, 34, 56)'
          && image.naturalWidth === 7 && image.naturalHeight === 5
          && readme.includes('# Code OSS on AppScene'),
        JSON.stringify({prelude:globalThis.__markdownPrelude,
          color:getComputedStyle(document.getElementById('preview')).color,
          width:image.naturalWidth,height:image.naturalHeight,readme:readme.slice(0, 80)}));
      record('stylesheet CSS url image is routed through the same controller',
        seen.get('/workspace/css-image.svg') === 1,
        JSON.stringify(Object.fromEntries(seen)));
      record('worker host broker receives every product-shaped resource',
        ['/workspace/prelude.js','/workspace/extension.css','/workspace/markdown-image.svg',
          '/workspace/css-image.svg'].every(path => seen.has(path)),
        JSON.stringify(Object.fromEntries(seen)));
      state.phase = 'image-matrix';
      const localPng = await loadImage(resourceUrl('markdown-image.png'));
      const missing = await loadImage(resourceUrl('missing.png'), true);
      const denied = await loadImage(`${resourceOrigin}/outside/denied.png`, true);
      const ordinary = await loadImage('/__webscene_markdown_external.svg');
      record('Markdown local binary image and ordinary host image load with dimensions',
        localPng.width === 1 && localPng.height === 1
          && ordinary.width === 2 && ordinary.height === 3,
        JSON.stringify({localPng, ordinary}));
      record('missing and out-of-root Markdown images fail closed',
        missing.event === 'error' && missing.width === 0 && missing.height === 0
          && denied.event === 'error' && denied.width === 0 && denied.height === 0
          && seen.get('/workspace/missing.png') === 1
          && seen.get('/outside/denied.png') === 1,
        JSON.stringify({missing, denied, seen:Object.fromEntries(seen)}));
      state.phase = 'consumer-matrix';
      const consumerAssets = [
        ['markdown', 'markdown/preview.js', 'text/javascript', 'consumerMarkdown'],
        ['notebook', 'notebook/renderer.js', 'text/javascript', 'notebook-renderer'],
        ['custom-editor', 'custom-editor/editor.css', 'text/css', 'custom-editor'],
        ['extension-detail', 'extension-detail/icon.svg', 'image/svg+xml', '<svg'],
        ['chat-mcp', 'chat-mcp/app.js', 'text/javascript', 'chat-mcp'],
        ['mermaid-script', 'mermaid/index.js', 'text/javascript', 'mermaid'],
        ['mermaid-style', 'mermaid/codicon.css', 'text/css', 'codicon'],
        ['simple-browser-script', 'simple-browser/main.js', 'text/javascript', 'consumerSimpleBrowser'],
        ['simple-browser-style', 'simple-browser/main.css', 'text/css', 'simple-browser'],
        ['release-notes', 'release-notes/media.svg', 'image/svg+xml', '<svg']
      ];
      const consumerResults = [];
      for (const [consumer, path, mime, marker] of consumerAssets) {
        const response = await fetch(resourceUrl(path));
        const body = await response.text();
        consumerResults.push({consumer, path, status:response.status,
          mime:response.headers.get('content-type'), marker:body.includes(marker)});
      }
      record('representative Code OSS consumers share the unchanged resource broker',
        consumerResults.every((result, index) => result.status === 200 && result.marker
          && result.mime?.startsWith(consumerAssets[index][2]))
          && consumerAssets.every(([, path]) => seen.get(`/workspace/${path}`) === 1),
        JSON.stringify({consumerResults, seen:Object.fromEntries(seen)}));
      state.phase = 'concurrent-body-bound';
      const batch = await Promise.all(Array.from({length:32}, async (_, index) => {
        const response = await fetch(resourceUrl(`batch/${index}.bin`));
        return {status:response.status, bytes:(await response.arrayBuffer()).byteLength};
      }));
      record('32 concurrent one MiB consumer resources complete inside the 64 MiB bound',
        batch.every(result => result.status === 200 && result.bytes === 1024 * 1024)
          && [...seen.keys()].filter(path => path.startsWith('/workspace/batch/')).length === 32,
        JSON.stringify(batch));
      state.phase = 'warm-validator-cycles';
      const warmDurations = [];
      for (let cycle = 0; cycle < 100; ++cycle) {
        const started = performance.now();
        const response = await fetch(resourceUrl('warm-64k.bin'));
        if (response.status !== 200 || (await response.arrayBuffer()).byteLength !== 64 * 1024) {
          throw new Error(`warm consumer resource cycle ${cycle} failed`);
        }
        warmDurations.push(performance.now() - started);
        if (cycle === 0) await new Promise(resolve => setTimeout(resolve, 10));
      }
      const warmOrdered = [...warmDurations].sort((a, b) => a - b);
      const warmP95 = warmOrdered[Math.ceil(warmOrdered.length * .95) - 1];
      state.diagnostics.push({name:'consumer-resource-cycles', cycles:100, p95:warmP95,
        requests:seen.get('/workspace/warm-64k.bin'),
        streamStarts:streamStarts.get('/workspace/warm-64k.bin')});
      record('100 validator-backed 64 KiB consumer cycles stay bounded and reuse one body',
        warmP95 <= 100 && seen.get('/workspace/warm-64k.bin') === 100
          && streamStarts.get('/workspace/warm-64k.bin') === 1,
        JSON.stringify({warmP95, seen:Object.fromEntries(seen),
          streamStarts:Object.fromEntries(streamStarts)}));
      const preview = document.getElementById('preview');
      state.phase = 'css-image-cycles';
      for (let cycle = 0; cycle < 100; ++cycle) {
        const prior = seen.get('/workspace/css-image.svg') || 0;
        const started = performance.now();
        preview.style.backgroundImage = `url("${resourceUrl(`css-image.svg?cycle=${cycle}`)}")`;
        for (let attempt = 0;
          attempt < 100 && (seen.get('/workspace/css-image.svg') || 0) === prior;
          ++attempt) await new Promise(resolve => setTimeout(resolve, 1));
        if ((seen.get('/workspace/css-image.svg') || 0) === prior) {
          throw new Error(`CSS image cycle ${cycle} did not reach the host broker`);
        }
        state.durations.push(performance.now() - started);
      }
      const ordered = [...state.durations].sort((a, b) => a - b);
      const p95 = ordered[Math.ceil(ordered.length * .95) - 1];
      state.diagnostics.push({name:'css-image-cycles', cycles:100, p95});
      record('100 warm CSS image cycles remain within the 100 ms p95 budget',
        p95 <= 100, `p95=${p95}`);
      let prior = seen.get('/workspace/denied.svg') || 0;
      state.phase = 'denied-css-image';
      preview.style.backgroundImage = `url("${resourceUrl('denied.svg')}")`;
      for (let attempt = 0;
        attempt < 100 && (seen.get('/workspace/denied.svg') || 0) === prior;
        ++attempt) await new Promise(resolve => setTimeout(resolve, 1));
      record('handled CSS image failure remains inside the controller',
        (seen.get('/workspace/denied.svg') || 0) === prior + 1,
        JSON.stringify(Object.fromEntries(seen)));
      preview.style.backgroundImage = 'url("fallback.svg")';
      state.phase = 'fallback-css-image';
      await new Promise(resolve => setTimeout(resolve, 20));
      prior = seen.get('/workspace/stale.svg') || 0;
      state.phase = 'stale-css-image';
      preview.style.backgroundImage = `url("${resourceUrl('stale.svg')}")`;
      for (let attempt = 0;
        attempt < 100 && (seen.get('/workspace/stale.svg') || 0) === prior;
        ++attempt) await new Promise(resolve => setTimeout(resolve, 1));
      prior = seen.get('/workspace/css-image.svg') || 0;
      preview.style.backgroundImage = `url("${resourceUrl('css-image.svg?final=1')}")`;
      for (let attempt = 0;
        attempt < 100 && (seen.get('/workspace/css-image.svg') || 0) === prior;
        ++attempt) await new Promise(resolve => setTimeout(resolve, 1));
      await new Promise(resolve => setTimeout(resolve, 40));
      record('late CSS image response cannot replace the current style',
        getComputedStyle(preview).backgroundImage.includes('css-image.svg?final=1'),
        getComputedStyle(preview).backgroundImage);
      state.phase = 'unregister';
      await registration.unregister();
      state.phase = 'done';
    })().catch(error => {
      state.errors.push(String(error && error.stack || error));
      record('contract completed', false, state.errors[0]);
    }).finally(() => {
      if (controlReload) return;
      const failure = state.results.find(result => result.status !== 'PASS');
      state.harness = failure
        ? {status:1, message:failure.message, stack:failure.stack}
        : {status:0, message:null, stack:null};
      state.complete = true;
    });
  }
</script>
