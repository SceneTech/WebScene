<!doctype html>
<meta charset="utf-8">
<title>Nested document unload ordering contract</title>
<body>
<script>
  const state = globalThis.__webSceneWptState = {
    complete: false, harness: null, results: [], errors: [], diagnostics: []
  };
  const record = (name, condition, detail = null) => state.results.push({
    name, status: condition ? "PASS" : "FAIL",
    message: condition ? null : String(detail || "Contract failed"), stack: null
  });
  const finish = error => {
    if (state.complete) return;
    if (error) state.errors.push(String(error && error.stack || error));
    const failed = state.results.find(result => result.status !== "PASS");
    state.harness = error || failed
      ? { status: 1, message: error ? String(error) : failed.message, stack: null }
      : { status: 0, message: null, stack: null };
    state.complete = true;
  };

  const source = "resources/iframe-unload-ordering-source.html";
  const replacement = "resources/iframe-same-origin-navigation-fake.html?unload";
  const unloadedTaskRuns = { navigation: 0, detach: 0 };
  globalThis.__webSceneNestedUnloadedTask = mode => ++unloadedTaskRuns[mode];

  const runCase = mode => new Promise((resolve, reject) => {
    const frame = document.createElement("iframe");
    frame.setAttribute("sandbox", "allow-same-origin allow-scripts");
    frame.setAttribute("data-lifecycle-mode", mode);
    frame.src = source;
    document.body.appendChild(frame);
    const proxy = frame.contentWindow;
    let outgoingDocument = null;
    let handled = false;
    const order = [];
    const timeout = setTimeout(() => reject(new Error(
      `${mode} nested document did not complete`)), 3000);

    globalThis.__webSceneNestedLifecycleEvent = (type, event, sourceDocument) => {
      order.push(type);
      record(`${mode} ${type} has the non-bubbling event shape`,
        event.type === type && event.bubbles === false
          && event.cancelable === (type === "beforeunload"));
      record(`${mode} keeps the outgoing realm through ${type}`,
        sourceDocument === outgoingDocument
          && proxy.document === outgoingDocument);
      if (type === "pagehide") {
        record(`${mode} pagehide precedes the hidden transition`,
          outgoingDocument.hidden === false && event.persisted === false);
      }
      if (type === "visibilitychange") {
        record(`${mode} visibilitychange observes the hidden document`,
          event.target === outgoingDocument
            && outgoingDocument.hidden === true
            && outgoingDocument.visibilityState === "hidden");
        frame.src = `${replacement}-reentrant`;
      }
      if (type === "unload") {
        record(`${mode} unload observes the hidden document`,
          outgoingDocument.hidden === true
            && outgoingDocument.visibilityState === "hidden");
      }
    };

    proxy.addEventListener("DOMContentLoaded", event => {
      if (handled) return;
      handled = true;
      outgoingDocument = event.target;
      try {
        if (mode === "navigation") {
          proxy.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
              record("navigation retires tasks from the outgoing realm",
                unloadedTaskRuns.navigation === 0);
              record("navigation preserves the stable WindowProxy",
                frame.contentWindow === proxy);
              state.diagnostics.push({ mode, order: [...order] });
              frame.remove();
              clearTimeout(timeout);
              resolve();
            }, 0);
          }, { once: true });
          frame.src = replacement;
          record("navigation lifecycle is synchronous and ordered",
            order.join(",")
              === "beforeunload,pagehide,visibilitychange,unload", order);
          record("the initiating navigation wins unload reentrancy",
            frame.getAttribute("src") === replacement,
            frame.getAttribute("src"));
        } else {
          frame.remove();
          record("detach skips beforeunload and orders final events",
            order.join(",") === "pagehide,visibilitychange,unload", order);
          record("detach retires the owner-facing browsing context",
            frame.contentWindow === null && frame.contentDocument === null);
          setTimeout(() => {
            record("detach retires tasks from the outgoing realm",
              unloadedTaskRuns.detach === 0);
            state.diagnostics.push({ mode, order: [...order] });
            clearTimeout(timeout);
            resolve();
          }, 0);
        }
      } catch (error) {
        clearTimeout(timeout);
        reject(error);
      }
    }, { once: true });
  });

  (async () => {
    try {
      await runCase("navigation");
      await runCase("detach");
      delete globalThis.__webSceneNestedLifecycleEvent;
      delete globalThis.__webSceneNestedUnloadedTask;
      finish();
    } catch (error) {
      finish(error);
    }
  })();
</script>
</body>
