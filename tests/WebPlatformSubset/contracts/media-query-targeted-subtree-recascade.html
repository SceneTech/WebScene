<!doctype html>
<meta charset="utf-8">
<title>Viewport media changes recascade matched subtrees</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<style>
  .media-shell { --leaf-width:17px; padding-left:3px; }
  .media-leaf { width:var(--leaf-width); height:11px; }
  .unaffected-sibling { width:23px; height:5px; }
  .media-direct-shell { padding-left:2px; }
  .media-direct-leaf { height:7px; }
  .media-inherit-shell { width:17px; }
  .media-inherit-leaf { width:inherit; }
  @media (max-width:600px) {
    .media-shell { --leaf-width:41px; padding-left:13px; }
    .media-leaf { height:29px; }
    .media-direct-shell { padding-left:19px; }
    .media-direct-leaf { height:31px; }
    .media-inherit-shell { width:43px; }
  }
</style>
<section id="viewport-target" class="media-shell"><div class="media-leaf"></div></section>
<aside class="unaffected-sibling"></aside>
<section class="media-direct-shell"><div class="media-direct-leaf"></div></section>
<section class="media-inherit-shell"><div class="media-inherit-leaf"></div></section>
<script>
  promise_test(async () => {
    const shell = document.querySelector(".media-shell");
    const leaf = document.querySelector(".media-leaf");
    const sibling = document.querySelector(".unaffected-sibling");
    const directShell = document.querySelector(".media-direct-shell");
    const directLeaf = document.querySelector(".media-direct-leaf");
    const inheritLeaf = document.querySelector(".media-inherit-leaf");
    const snapshot = () => [
      getComputedStyle(shell).paddingLeft,
      getComputedStyle(leaf).width,
      getComputedStyle(leaf).height,
      getComputedStyle(sibling).width,
      getComputedStyle(directShell).paddingLeft,
      getComputedStyle(directLeaf).height,
      getComputedStyle(inheritLeaf).width
    ];

    assert_array_equals(snapshot(), ["3px", "17px", "11px", "23px", "2px", "7px", "17px"],
      "wide base styles are active");
    await test_driver.set_viewport(shell, 480, 400);
    assert_array_equals(snapshot(), ["13px", "41px", "29px", "23px", "19px", "31px", "43px"],
      "activation updates direct matches and inherited descendants");
    await test_driver.set_viewport(shell, 800, 600);
    assert_array_equals(snapshot(), ["3px", "17px", "11px", "23px", "2px", "7px", "17px"],
      "deactivation restores base styles without disturbing the unrelated sibling");
  }, "media-query activation and deactivation recascade matched subtrees");
</script>
<script>
  promise_test(async t => {
    const list = document.createElement('section');
    list.id = 'media-matching-viewport-target';
    list.className = 'media-matching-list';
    const nodes = Array.from({length:128}, () => document.createElement('b'));
    list.append(...nodes);
    const style = document.createElement('style');
    style.textContent = `
      .media-matching-list > b {display:block;width:11px;height:13px}
      .media-matching-list > b:nth-child(odd) {height:17px}
      .media-matching-list > b:first-child ~ b {width:19px}
      @media(max-width:600px) {
        .media-matching-list {--size:23px}
        .media-matching-list > b {width:var(--size)}
      }`;
    document.head.appendChild(style); document.body.appendChild(list);
    t.add_cleanup(() => {list.remove(); style.remove();});
    for (let pass=0; pass<4; ++pass) {
      if (pass===2) list.prepend(list.lastChild);
      await test_driver.set_viewport(list, pass%2 ? 800 : 480, 600);
      Array.from(list.children).forEach((node,index) => {
        assert_equals(getComputedStyle(node).width,
          index ? '19px' : pass%2 ? '11px' : '23px', 'sibling width at pass '+pass+' index '+index);
        assert_equals(getComputedStyle(node).height, index%2 ? '13px' : '17px',
          'position at pass '+pass+' index '+index);
      });
    }
  }, 'repeated media transitions use current sibling order without retaining matching state across mutations');
</script>
