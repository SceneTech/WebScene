<!doctype html>
<meta charset="utf-8">
<title>Nested context menu handoff contract</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<style>
  html, body { margin: 0; width: 800px; height: 600px; }
  #webview {
    position: absolute;
    left: 80px;
    top: 60px;
    width: 200px;
    height: 120px;
    border: 4px solid black;
  }
</style>
<iframe id="webview" data-vscode-context='{"scope":"outer","outerOnly":true}'></iframe>
<script>
  const frame = document.querySelector("#webview");
  const childDocument = frame.contentDocument;
  childDocument.body.style.margin = "0";
  childDocument.body.dataset.vscodeContext = JSON.stringify({
    scope: "body", shared: "body", bodyOnly: true
  });
  const ancestor = childDocument.createElement("div");
  ancestor.dataset.vscodeContext = JSON.stringify({
    scope: "ancestor", shared: "ancestor", ancestorOnly: true
  });
  ancestor.style.cssText = [
    "position:absolute", "left:10px", "top:8px", "width:40px", "height:30px"
  ].join(";");
  const target = childDocument.createElement("button");
  target.textContent = "target";
  target.dataset.vscodeContext = JSON.stringify({
    shared: "target", targetOnly: true
  });
  target.style.cssText = "width:40px;height:30px;padding:0;border:0";
  ancestor.appendChild(target);
  childDocument.body.appendChild(ancestor);

  const state = {
    cancelled: 0,
    requests: [],
    visibleDuringHandoff: false,
    pathCrossedDocument: null
  };
  window.receiveContextMenu = data => {
    state.requests.push(data);
    childDocument.body.classList.toggle("vscode-context-menu-visible", true);
    state.visibleDuringHandoff =
      childDocument.body.classList.contains("vscode-context-menu-visible");
  };
  target.addEventListener("contextmenu", event => event.preventDefault(), {once: true});
  frame.contentWindow.addEventListener("contextmenu", event => {
    if (event.defaultPrevented) {
      ++state.cancelled;
      return;
    }
    event.preventDefault();
    let context = {};
    let element = event.target;
    while (true) {
      if (!element) break;
      element = element.closest("[data-vscode-context]");
      if (!element) break;
      context = {...JSON.parse(element.dataset.vscodeContext), ...context};
      element = element.parentElement;
    }
    state.pathCrossedDocument = event.composedPath().includes(frame);
    receiveContextMenu({
      clientX: event.clientX,
      clientY: event.clientY,
      context,
      defaultPrevented: event.defaultPrevented
    });
  });

  const secondaryClick = element => new test_driver.Actions()
    .pointerMove(0, 0, {origin: element})
    .pointerDown({button: 2})
    .pointerUp({button: 2})
    .send();

  promise_test(async () => {
    await secondaryClick(target);
    assert_equals(state.cancelled, 1, "the inner cancellation reaches the host listener");
    assert_equals(state.requests.length, 0, "a cancelled event does not request a menu");
    assert_false(childDocument.body.classList.contains("vscode-context-menu-visible"));

    await secondaryClick(target);
    assert_equals(state.requests.length, 1, "the uncancelled event requests one menu");
    const request = state.requests[0];
    assert_equals(request.clientX, 30, "the handoff uses child viewport X");
    assert_equals(request.clientY, 23, "the handoff uses child viewport Y");
    assert_true(request.defaultPrevented, "the host handler suppresses the browser default");
    assert_object_equals(request.context, {
      scope: "ancestor",
      shared: "target",
      bodyOnly: true,
      ancestorOnly: true,
      targetOnly: true
    }, "target-to-body context values merge without crossing the iframe boundary");
    assert_false(state.pathCrossedDocument, "the child event path excludes its iframe owner");
    assert_true(state.visibleDuringHandoff, "the visible-state class reaches the child body");

    childDocument.body.classList.toggle("vscode-context-menu-visible", false);
    assert_false(childDocument.body.classList.contains("vscode-context-menu-visible"),
      "the visible-state class clears when the menu hides");
  }, "nested context menus preserve cancellation, ancestry, visibility, and coordinates");
</script>
