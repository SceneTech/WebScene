<!doctype html>
<meta charset="utf-8">
<title>A fixed child menu escapes the overflow clip of its fixed parent menu</title>
<link rel="match" href="nested-fixed-submenu-overflow-paint-ref.html">
<style>
  html, body { margin: 0; width: 400px; height: 180px; background: white; }
  #portal { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 1; }
  #menu { position: fixed; left: 140px; top: 20px; width: 120px; height: 100px;
    background: rgb(30, 30, 30); z-index: 500; }
  #scroll { width: 120px; height: 100px; overflow: hidden auto; }
  #row { width: 120px; height: 40px; }
  #submenu { position: fixed; left: 20px; top: 40px; width: 80px; height: 60px;
    background: rgb(0, 128, 0); z-index: 500; }
</style>
<div id="portal">
  <div id="menu">
    <div id="scroll">
      <div id="row"><div id="submenu"></div></div>
    </div>
  </div>
</div>
