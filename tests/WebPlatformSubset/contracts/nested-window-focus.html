<!doctype html><meta charset="utf-8"><title>Nested Window focus contract</title>
<button id="outer">outer</button><iframe id="frame"></iframe>
<script>
const state=globalThis.__webSceneWptState={complete:false,harness:null,results:[],errors:[],diagnostics:[]};
const record=(name,condition,detail)=>state.results.push({name,status:condition?'PASS':'FAIL',message:condition?null:String(detail||'Contract failed'),stack:null});
const finish=error=>{if(error)state.errors.push(String(error&&error.stack||error));const failed=state.results.find(x=>x.status!=='PASS');state.harness=error||failed?{status:1,message:error?String(error):failed.message,stack:null}:{status:0,message:null,stack:null};state.complete=true;};
setTimeout(()=>{ try {
 const frame=document.querySelector('#frame'),doc=frame.contentDocument; doc.body.innerHTML='<button id="inner">inner</button>';
 const events=[]; addEventListener('blur',()=>events.push('outer-window:blur')); addEventListener('focus',()=>events.push('outer-window:focus'));
 record('initial child document is not focused',!doc.hasFocus()); frame.contentWindow.focus();
 record('Window.focus enters child browsing context',document.activeElement===frame&&doc.activeElement===doc.body&&doc.hasFocus(),JSON.stringify({outer:document.activeElement?.id||document.activeElement?.tagName,inner:doc.activeElement?.tagName,innerHas:doc.hasFocus()}));
 doc.querySelector('#inner').focus(); record('inner element focus retains frame ownership',document.activeElement===frame&&doc.activeElement.id==='inner'&&doc.hasFocus());
 document.querySelector('#outer').focus(); record('outer focus exits child browsing context',document.activeElement.id==='outer'&&doc.activeElement===doc.body&&!doc.hasFocus());
 record('outer window observes nested focus entry and return',events.join(',')==='outer-window:blur,outer-window:focus',events.join(','));
 const opaque=document.createElement('iframe');opaque.setAttribute('sandbox','allow-scripts');document.body.appendChild(opaque);let blocked=opaque.contentDocument===null;try{blocked=blocked&&(opaque.contentWindow===null||!opaque.contentWindow.document)}catch{blocked=true}record('opaque frame focus remains inaccessible',blocked); finish();
} catch(error){finish(error)}},0);
</script>
