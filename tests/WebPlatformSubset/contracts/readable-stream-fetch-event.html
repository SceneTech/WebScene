<!doctype html>
<meta charset="utf-8">
<title>ReadableStream body and FetchEvent vertical</title>
<script>
  const state = window.__webSceneWptState = {
    complete:false, harness:null, results:[], errors:[], diagnostics:[]
  };
  function record(name, condition, detail = 'Contract failed') {
    state.results.push({name, status:condition ? 'PASS' : 'FAIL',
      message:condition ? null : detail, stack:null});
  }
  (async () => {
    const registration = await navigator.serviceWorker.register(
      'readable-stream-fetch-event-worker.js');
    const worker = registration.active || registration.waiting || registration.installing;
    if (worker.state !== 'activated') {
      await new Promise(resolve => worker.addEventListener('statechange', () => {
        if (worker.state === 'activated') resolve();
      }));
    }
    const report = await new Promise(resolve => {
      const channel = new MessageChannel();
      channel.port1.onmessage = event => resolve(event.data);
      worker.postMessage('probe', [channel.port2]);
    });
    record('ReadableStream body clone preserves streamed status and bytes',
      report.status === 206 && report.text === 'ABC' && report.cloneText === 'ABC'
        && report.bodyUsed, JSON.stringify(report));
    record('ReadableStream and FetchEvent expose WebIDL brands and inheritance',
      report.readableTag === '[object ReadableStream]'
        && report.fetchTag === '[object FetchEvent]' && report.fetchChain,
      JSON.stringify(report));
    record('selected WebIDL members are enumerable',
      report.readableEnumerable && report.fetchEnumerable, JSON.stringify(report));
    await registration.unregister();
  })().catch(error => {
    state.errors.push(String(error && error.stack || error));
    record('contract completed', false, state.errors[0]);
  }).finally(() => {
    const failure = state.results.find(result => result.status !== 'PASS');
    state.harness = failure
      ? {status:1, message:failure.message, stack:failure.stack}
      : {status:0, message:null, stack:null};
    state.complete = true;
  });
</script>
