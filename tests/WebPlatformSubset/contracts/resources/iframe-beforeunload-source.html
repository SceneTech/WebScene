<!doctype html>
<meta charset="utf-8">
<title>Before unload source</title>
<main id="retained">retained</main>
<script>
  addEventListener("beforeunload", event => {
    parent.__webSceneBeforeUnloadHandler(event);
  });
  addEventListener("beforeunload", event => {
    parent.__webSceneBeforeUnloadObserver(event);
  });
  addEventListener("pagehide", event => {
    parent.__webScenePageHideHandler(event);
  });
</script>
