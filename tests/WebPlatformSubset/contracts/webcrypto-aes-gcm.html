<!doctype html>
<meta charset="utf-8">
<title>Web Crypto AES-GCM contract</title>
<!--
  Pinned WPT sources: WebCryptoAPI/encrypt_decrypt/aes_gcm_vectors.https.any.js,
  generateKey/successes_AES-GCM.https.any.js, and import_export/aes_gcm.https.any.js
  at 2c705104a295c48053eeddf7fe0170d790a4e853. This bounded contract retains the
  NIST vector, key metadata, import/export, authentication, usage, and call-time
  copy behavior required by issue #102.
-->
<script>
window.__webSceneWptState={complete:false,harness:null,results:[],errors:[],diagnostics:[]};
const record=(name,condition,message='Contract failed')=>
  __webSceneWptState.results.push({name,status:condition?'PASS':'FAIL',message:condition?null:message,stack:null});
const hex=value=>Array.from(new Uint8Array(value),byte=>byte.toString(16).padStart(2,'0')).join('');
const finish=()=>{const state=__webSceneWptState;state.harness={status:state.results.some(r=>r.status!=='PASS')?1:0,message:null,stack:null};state.complete=true;};
(async()=>{
  const raw=new Uint8Array(16),iv=new Uint8Array(12),plain=new Uint8Array(16);
  const key=await crypto.subtle.importKey('raw',raw,'aes-gcm',true,['encrypt','decrypt']);
  record('AES-GCM CryptoKey metadata',key instanceof CryptoKey&&key.type==='secret'&&
    key.extractable&&key.algorithm.name==='AES-GCM'&&key.algorithm.length===128&&
    key.usages.join(',')==='encrypt,decrypt');
  const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);
  record('NIST AES-GCM zero vector',hex(encrypted)===
    '0388dace60b6a392f328c2b971b2fe78ab6e47d42cec13bdf53a67b21257bddf');
  record('AES-GCM authenticated decrypt',hex(await crypto.subtle.decrypt(
    {name:'AES-GCM',iv},key,encrypted))===hex(plain));
  const jwk=await crypto.subtle.exportKey('jwk',key);
  record('AES-GCM JWK export',jwk.kty==='oct'&&jwk.alg==='A128GCM'&&
    jwk.k==='AAAAAAAAAAAAAAAAAAAAAA'&&jwk.ext===true);
  const tampered=new Uint8Array(encrypted);tampered[tampered.length-1]^=1;
  let auth='';try{await crypto.subtle.decrypt({name:'AES-GCM',iv},key,tampered);}catch(error){auth=error.name;}
  record('AES-GCM rejects a changed authentication tag',auth==='OperationError',`Received ${auth}`);
  const oneWay=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt']);
  let usage='';try{await crypto.subtle.decrypt({name:'AES-GCM',iv},oneWay,encrypted);}catch(error){usage=error.name;}
  record('AES-GCM enforces key usages',usage==='InvalidAccessError',`Received ${usage}`);
  let malformed='';try{await crypto.subtle.importKey('jwk',{
    kty:'oct',k:'AAAAAAAAAAAAAAAAAAAAAA!',alg:'A128GCM',ext:true,key_ops:['encrypt']
  },'AES-GCM',true,['encrypt']);}catch(error){malformed=error.name;}
  record('AES-GCM rejects malformed Base64URL after a decoded key prefix',
    malformed==='DataError',`Received ${malformed}`);
  const copied=new Uint8Array(1024);copied.fill(0x5a);
  const pending=crypto.subtle.encrypt({name:'AES-GCM',iv},key,copied);copied.fill(0);
  record('AES-GCM copies input during the call',(await pending).byteLength===1040);
  const started=performance.now();
  for(let index=0;index<16;++index)
    await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new Uint8Array(256*1024));
  record('bounded AES-GCM throughput completes',performance.now()-started<8000);
})().catch(error=>{__webSceneWptState.errors.push(String(error));record('AES-GCM contract completed',false,String(error));}).finally(finish);
</script>
